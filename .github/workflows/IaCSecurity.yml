name: IaC Security

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Scan the Dockerfile and workflows
      uses: bridgecrewio/checkov-action@a32f8b5c5c7c958bc38947c65dfe139debaf0607 # v12.3140.0
      with:
        directory: .
        framework: dockerfile,github_actions
