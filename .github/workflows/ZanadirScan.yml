name: Zanadir Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  zanadir-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run zanadir Github action
      uses: mustachecase/zanadir-action@v1.10
      with:
        dir: .
        debug: true
        enforce: false
        output: sarif
        output-file: zanadir.sarif

    - name: Upload zanadir SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: zanadir.sarif
        category: zanadir

  # Only pushes to main publish, so a fork's pull request cannot move the badge.
  badge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Score our own coverage
      uses: mustachecase/zanadir-action@v1.10
      with:
        dir: .
        badge: .github/zanadir-badge.json

    - name: Commit the badge when it moved
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .github/zanadir-badge.json
        if git diff --staged --quiet; then
          echo "Coverage unchanged."
          exit 0
        fi
        git commit -m "chore: update the zanadir coverage badge"
        git push

  # A fork's pull request gets a read-only token, so it cannot comment.
  pr-comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Scan
      uses: mustachecase/zanadir-action@v1.10
      with:
        dir: .
        output: markdown
        output-file: zanadir.md

    - name: Post the report
      run: gh pr comment "$NUMBER" --body-file zanadir.md --edit-last --create-if-none
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NUMBER: ${{ github.event.pull_request.number }}
