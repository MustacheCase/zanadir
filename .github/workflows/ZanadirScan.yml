name: Zanadir Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  zanadir-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Run zanadir Github action
      uses: mustachecase/zanadir-action@a680c322fa9cf63f4ea5202b66c84fa3b69d154a # v1.12
      with:
        dir: .
        debug: true
        enforce: false
        output: sarif
        output-file: zanadir.sarif

    - name: Upload zanadir SARIF
      uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
      with:
        sarif_file: zanadir.sarif
        category: zanadir

  # Only pushes to main publish, so a fork's pull request cannot move the badge.
  badge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      # zizmor: ignore[artipacked] - the badge is pushed back from this job, so
      # the checkout credential is the point.
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Score our own coverage
      uses: mustachecase/zanadir-action@a680c322fa9cf63f4ea5202b66c84fa3b69d154a # v1.12
      with:
        dir: .
        badge: .github/zanadir-badge.json

    - name: Commit the badge when it moved
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .github/zanadir-badge.json
        if git diff --staged --quiet; then
          echo "Coverage unchanged."
          exit 0
        fi
        git commit -m "chore: update the zanadir coverage badge"
        git push

  # A fork's pull request gets a read-only token, so it cannot comment.
  pr-comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Scan
      uses: mustachecase/zanadir-action@a680c322fa9cf63f4ea5202b66c84fa3b69d154a # v1.12
      with:
        dir: .
        output: markdown
        output-file: zanadir.md

    - name: Post the report
      run: gh pr comment "$NUMBER" --body-file zanadir.md --edit-last --create-if-none
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NUMBER: ${{ github.event.pull_request.number }}
