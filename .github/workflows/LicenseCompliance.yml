name: License Compliance Scan
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  license-compliance-scan:
    # Dependabot runs and pull requests from forks do not receive repository
    # secrets; a fork's change is checked on the push to main once merged.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: License Compliance Scan
        uses: fossas/fossa-action@7f9093e8e9864a4fd9ab58426a3e34c54040da04 # main
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
