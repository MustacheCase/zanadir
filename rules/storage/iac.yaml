rules:
  - id: "checkov-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bcheckov\\b|bridgecrewio/checkov"
    weakenedWhen:
      - runMatches: "--soft-fail(?:\\s|$)"
        verdict: "advisory"
      - input: "soft_fail"
        equals: "true"
        verdict: "advisory"

  - id: "tfsec-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\btfsec\\b"
    weakenedWhen:
      - runMatches: "--soft-fail(?:\\s|$)"
        verdict: "advisory"
      - input: "soft_fail"
        equals: "true"
        verdict: "advisory"

  - id: "terrascan-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bterrascan\\b"

  - id: "kics-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bkics\\b|checkmarx/kics"

  - id: "kubescape-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bkubescape\\b"

  # "snyk" alone is the SCA rule; only the iac sub-command scans infrastructure.
  - id: "snyk-iac-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bsnyk\\s+iac\\b"

  # Likewise trivy: config, or misconfig among the scanners of another
  # sub-command. See trivy-rule in sca.yaml.
  - id: "trivy-config-rule"
    applyOn: ["Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\btrivy\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*(?:config|conf)(?:\\s|$)|\\btrivy\\b[^\\n]*--(?:scanners|security-checks)[= ](?:[\\w-]+,)*(?:misconfig|config)\\b"
    weakenedWhen:
      - runMatches: "--exit-code[= ]+0\\b"
        verdict: "advisory"

  - id: "cfn-nag-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bcfn[-_]nag\\b"

  - id: "cfn-lint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bcfn-lint\\b"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-sast-iac-template-rule"
    applyOn: ["Job.Package"]
    categories: ["IaC Security"]
    regex: "(?i)^(?:jobs|security)/sast-iac(?:\\.latest)?\\.gitlab-ci\\.yml$"
