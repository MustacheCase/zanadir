rules:
  # NVIDIA SkillSpector. It exits 1 when a skill's risk score is over 50, so
  # the default run already gates. Only its scan command counts: the tool's
  # own CI runs skillspector --version and builds an image of that name.
  - id: "skillspector-rule"
    name: "SkillSpector"
    applyOn: ["Job.Run"]
    categories: ["Agent Skill Security"]
    regex: "(?i)\\bskillspector(?::[\\w.-]+)?\\s+scan\\b"

  # Cisco AI Defense skill-scanner, as its reusable workflow or its CLI.
  # "skill-scanner" alone is also Sentry's skill of that name, which runs
  # inside an agent rather than in CI, so the CLI needs a scan subcommand.
  # The CLI exits 0 on findings unless --fail-on-severity or
  # --fail-on-findings is given; like poutine's, a missing flag is not
  # graded.
  - id: "cisco-skill-scanner-rule"
    name: "Cisco Skill Scanner"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Agent Skill Security"]
    regex: "(?i)\\bcisco-ai-defense/skill-scanner\\b|(?:^|[\\s/])skill-scanner\\s+scan(?:-all|-repo)?\\b"

  # Snyk Agent Scan, formerly Invariant's mcp-scan, which scans skills unless
  # told not to. It exits 0 on findings without --ci.
  - id: "snyk-agent-scan-rule"
    name: "Snyk Agent Scan"
    applyOn: ["Job.Run"]
    categories: ["Agent Skill Security"]
    regex: "(?i)\\bsnyk-agent-scan\\b"
    unless: "--no-skills\\b"

  # Stroq (@stroq/cli) inspect reads skills, hooks and MCP configs and exits 1
  # on findings unless --fail-on none, as does its Action; --env only prints.
  - id: "stroq-rule"
    name: "Stroq"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Agent Skill Security"]
    regex: "(?i)^aggib/stroq-action$|(?:^|[\\s/])(?:stroq|@stroq/cli(?:@\\S+)?)\\s+inspect(?:\\s|$)"
    unless: "(?:^|\\s)--env(?:[\\s=]|$)"
    weakenedWhen:
      - runMatches: "(?i)--fail-on[= ]+[\"']?none\\b"
        verdict: "advisory"
      - input: "fail-on"
        equals: "none"
        verdict: "advisory"

  # stroq vet reads a skill or MCP server and exits 0 whatever it finds.
  - id: "stroq-vet-rule"
    name: "Stroq"
    applyOn: ["Job.Run"]
    categories: ["Agent Skill Security"]
    regex: "(?i)(?:^|[\\s/])(?:stroq|@stroq/cli(?:@\\S+)?)\\s+vet(?:\\s|$)"
    exitsZeroUnless:
      runMatches: "[^\\s\\S]"
