name: Image Scan

on:
  schedule:
    - cron: '43 5 * * *'
  # A scheduled-only workflow is disabled after a quiet period; this restarts it.
  workflow_dispatch:

permissions: {}

jobs:
  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the published image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: "mustachecase/zanadir:latest"
          output-format: sarif
          severity-cutoff: medium

      - name: Upload the findings to code scanning
        if: ${{ always() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image
