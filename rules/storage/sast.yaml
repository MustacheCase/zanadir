rules:
  - id: "semgrep-rule"
    name: "Semgrep"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bsemgrep\\b"
    # semgrep ci fails on blocking findings; scan only with --error.
    exitsZeroUnless:
      runMatches: "\\bsemgrep\\s+ci\\b|--error\\b"

  - id: "opengrep-rule"
    name: "Opengrep"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bopengrep\\b"
    unless: "(?i)\\bopengrep(?:\\s+--[\\w-]+)*\\s+(?:test|validate|show|lsp)\\b"
    # opengrep ci fails on blocking findings; scan only with --error.
    exitsZeroUnless:
      runMatches: "\\bopengrep(?:\\s+--[\\w-]+)*\\s+ci\\b|--error\\b"

  - id: "flawfinder-rule"
    name: "Flawfinder"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bflawfinder\\b"
    unlessPackage: "(?i)^david-a-wheeler/flawfinder"
    # flawfinder exits 0 on findings; it fails only with --error-level.
    exitsZeroUnless:
      input: "arguments"
      runMatches: "--error-level\\b"

  # The CLI, the init action (parser/github.go turns it into the database it
  # creates) and Azure's tasks; not upload-sarif, which uploads any tool's
  # SARIF. CodeQL on actions alone checks workflows, not code.
  - id: "codeql-rule"
    name: "CodeQL"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bcodeql\\s+(?:database|query|github|resolve|pack)\\b|advancedsecurity-codeql-"
    unless: "(?i)--language[= ]actions(?:\\s|$)"

  # A workflow that runs CodeQL's own action is decided by its steps.
  - id: "codeql-name-rule"
    name: "CodeQL"
    applyOn: ["Artifact.Name"]
    categories: ["SAST"]
    regex: "(?i)\\bcodeql\\b"
    unlessPackage: "(?i)^github/codeql-action/"

  # Bare "sonar" appears in unrelated names, so require a product suffix, the
  # action's org prefix, or the Azure task or Jenkins step that runs it. The
  # name must start a word: as a flag or its value (gcovr --sonarqube, jest
  # --coverageReporters=lcov,sonarqube) it only names a report format.
  - id: "sonar-rule"
    name: "SonarQube"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)(?:^|[\\s/\"'(])sonar(qube|cloud|-scanner)\\b|sonarsource/|^sonar(?:qube|cloud)analyze$|^withsonarqubeenv$|^waitforqualitygate$"
    # Gradle's -x skips the task it names.
    unless: "(?i)(?:^|\\s)(?:-x|--exclude-task)\\s+sonarqube\\b"
    # Jenkins: a quality gate that does not abort the pipeline only reports.
    weakenedWhen:
      - input: "abortPipeline"
        equals: "false"
        verdict: "advisory"

  - id: "gosec-rule"
    name: "gosec"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bgosec\\b|securego/gosec"

  - id: "bandit-rule"
    name: "Bandit"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bbandit\\b|pycqa/bandit"

  - id: "brakeman-rule"
    name: "Brakeman"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bbrakeman\\b"

  # Sobelow exits 0 on findings unless --exit is specified.
  # It reads .sobelow-conf only with --config, and that file can set exit.
  - id: "sobelow-rule"
    name: "Sobelow"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)(?:^|[\\s/])sobelow(?:[\\s:]|$)|^sobelow/action(?:@|$)"
    # Installing or compiling it, or asking its version, scans nothing.
    unless: "(?i)\\bmix\\s+(?:escript\\.install|archive\\.install|deps\\.\\w+|hex\\.\\w+)\\s|\\bsobelow\\s+--version\\b"
    exitsZeroUnless:
      input: "flags"
      runMatches: "--exit\\b"
      unknownWhen: "(?:^|\\s)--config(?:[= ]|$)"

  # "snyk" alone is the SCA rule; only the code sub-command is SAST.
  - id: "snyk-code-rule"
    name: "Snyk Code"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bsnyk\\s+code\\b"

  # "bearer" is ubiquitous in auth headers, so never match the bare word.
  - id: "bearer-rule"
    name: "Bearer"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)bearer/bearer|\\bbearer\\s+scan\\b"

  - id: "checkmarx-rule"
    name: "Checkmarx"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bcheckmarx\\b"

  - id: "veracode-rule"
    name: "Veracode"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bveracode\\b"

  - id: "horusec-rule"
    name: "Horusec"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bhorusec\\b"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-sast-template-rule"
    name: "GitLab SAST"
    applyOn: ["Job.Package"]
    categories: ["SAST"]
    regex: "(?i)^(?:jobs|security)/sast(?:\\.latest)?\\.gitlab-ci\\.yml$|/components/sast/"

  # The Clang static analyzer, run through its build wrapper.
  - id: "scan-build-rule"
    name: "scan-build"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bscan-build\\b"

  # Fuzzing runs the code rather than reading it, but finds the same flaws,
  # crashes and memory errors on hostile input, before release. Building the
  # fuzzers alone finds nothing, and dry-run never fails.
  - id: "cifuzz-rule"
    name: "CIFuzz"
    applyOn: ["Job.Package"]
    categories: ["SAST"]
    regex: "(?i)^google/oss-fuzz/infra/cifuzz/actions/run_fuzzers$"
    weakenedWhen:
      - input: "dry-run"
        equals: "true"
        verdict: "advisory"

  - id: "clusterfuzzlite-rule"
    name: "ClusterFuzzLite"
    applyOn: ["Job.Package"]
    categories: ["SAST"]
    regex: "(?i)^google/clusterfuzzlite/actions/run_fuzzers$"
    weakenedWhen:
      - input: "dry-run"
        equals: "true"
        verdict: "advisory"

  - id: "cargo-fuzz-rule"
    name: "cargo-fuzz"
    applyOn: ["Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bcargo\\s+(?:\\+\\S+\\s+)?fuzz\\s+run\\b"

  - id: "njsscan-rule"
    name: "njsscan"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SAST"]
    regex: "(?i)\\bnjsscan\\b"
