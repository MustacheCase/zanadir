rules:
  - id: "actionlint-rule"
    name: "actionlint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Workflow Security"]
    regex: "(?i)\\bactionlint\\b|rhysd/actionlint|reviewdog/action-actionlint"

  # pinact run rewrites unpinned actions by default. Only --check, --diff or
  # --fix=false makes findings fail the build.
  - id: "pinact-rule"
    name: "pinact"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Workflow Security"]
    regex: "(?i)(?:^|[^\\w-])pinact\\s+run(?:\\s|$)"
    exitsZeroUnless:
      runMatches: "(?i)(?:^|\\s)--(?:check|diff|fix=false)(?:\\s|$)"

  - id: "zizmor-rule"
    name: "zizmor"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Workflow Security"]
    regex: "(?i)\\bzizmor\\b"
    unless: "(?i)^zizmorcore/zizmor-action$"
    unlessPackage: "(?i)^zizmorcore/zizmor-action$"
    # zizmor exits 0 whatever it finds with SARIF output or --no-exit-codes.
    weakenedWhen:
      - runMatches: "--format[= ]+[\"']?sarif\\b|--no-exit-codes\\b"
        verdict: "advisory"

  # zizmor-action runs zizmor --format=sarif and uploads the results unless
  # advanced-security is false.
  - id: "zizmor-action-rule"
    name: "zizmor"
    applyOn: ["Job.Package"]
    categories: ["Workflow Security"]
    regex: "(?i)^zizmorcore/zizmor-action$"
    exitsZeroUnless:
      input: "advanced-security"
      runMatches: "(?i)^false$"

  # glsec reads GitLab CI. It runs as the glsec command, as the
  # ghcr.io/glsec/glsec image, or as one of the two components under
  # glsec-io/glsec. Other images or components with "glsec" in their path, such
  # as gitlab.com/someone/glsec/glsec or glsec-io/glsec/glsec-extra, are not it.
  - id: "glsec-rule"
    name: "glsec"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Workflow Security"]
    regex: "(?i)(?:^|[\\s/])glsec(?:\\s|$)|ghcr\\.io/glsec/glsec(?:[:@\\s]|$)|glsec-io/glsec/glsec(?:-code-quality)?(?:@|$)"

  # poutine reads GitHub Actions and GitLab CI. The word is also a dish, so
  # only its action, its image or an analyze command. It exits 0 on findings
  # unless --fail-on-violation is set; like grype's, a missing flag is not
  # graded, or every default setup would read as weakened.
  - id: "poutine-rule"
    name: "poutine"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Workflow Security"]
    regex: "(?i)\\bboostsecurityio/poutine\\b|\\bpoutine\\b[^\\n]*\\banalyze_(?:local|repo|org)\\b"

  # "scorecard" is the tool's whole name, so the word is enough; the plural
  # "scorecards" is a different thing and the boundary excludes it.
  - id: "scorecard-rule"
    name: "OpenSSF Scorecard"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Workflow Security"]
    regex: "(?i)ossf/scorecard-action|\\bscorecard\\b"

  # CodeQL's actions language finds injection and other workflow flaws.
  - id: "codeql-actions-rule"
    name: "CodeQL"
    applyOn: ["Job.Run"]
    categories: ["Workflow Security"]
    regex: "(?i)\\bcodeql\\s+database\\s+create\\b[^\\n]*--language[= ](?:[\\w+-]+,)*actions\\b"

  # Harden-Runner watches the runner for the rest of the job it is in. Its
  # egress-policy defaults to block, which refuses calls outside
  # allowed-endpoints; audit only records what happened.
  - id: "harden-runner-rule"
    name: "Harden-Runner"
    applyOn: ["Job.Package"]
    categories: ["Workflow Security"]
    regex: "(?i)^step-security/harden-runner$"
    weakenedWhen:
      - input: "egress-policy"
        equals: "audit"
        verdict: "advisory"
