name: EOL Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  eol-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Build the image
      run: docker build -t zanadir:eol-scan .

    - name: Set up Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: v0.75.0
    - name: Scan the image for end-of-life components
      run: trivy image --exit-on-eol 1 zanadir:eol-scan
