name: Zanadir Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  zanadir-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Run zanadir Github action
      uses: mustachecase/zanadir-action@bbb18d2dc356752769d11206a089062fad66abec # v1.14
      with:
        dir: .
        # Load and stress testing is for services under traffic; this is a CLI.
        config: .zanadir.yml
        debug: true
        enforce: false
        output: sarif
        output-file: zanadir.sarif

    - name: Upload zanadir SARIF
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: zanadir.sarif
        category: zanadir

  # Only pushes to main publish, so a fork's pull request cannot move the badge.
  badge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      # zizmor: ignore[artipacked] - the badge is pushed back from this job, so
      # the checkout credential is the point.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Score our own coverage
      uses: mustachecase/zanadir-action@bbb18d2dc356752769d11206a089062fad66abec # v1.14
      with:
        dir: .
        # Load and stress testing is for services under traffic; this is a CLI.
        config: .zanadir.yml
        badge: zanadir-badge.json

    # main only takes changes through a pull request, so the badge lives on a
    # branch of its own that holds nothing else.
    - name: Publish the badge when it moved
      run: |
        set -euo pipefail
        cp zanadir-badge.json "$RUNNER_TEMP/zanadir-badge.json"
        rm -f zanadir-badge.json
        git config user.name github-actions
        git config user.email github-actions@github.com
        if git fetch --depth=1 origin badges 2>/dev/null; then
          git switch --discard-changes -C badges FETCH_HEAD
        else
          git switch --orphan badges
        fi
        cp "$RUNNER_TEMP/zanadir-badge.json" zanadir-badge.json
        git add zanadir-badge.json
        if git diff --cached --quiet; then
          echo "Coverage unchanged."
          exit 0
        fi
        git commit -m "chore: update the zanadir coverage badge"
        git push origin badges

  # A fork's pull request gets a read-only token, so it cannot comment.
  pr-comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Scan
      uses: mustachecase/zanadir-action@bbb18d2dc356752769d11206a089062fad66abec # v1.14
      with:
        dir: .
        # Load and stress testing is for services under traffic; this is a CLI.
        config: .zanadir.yml
        output: markdown
        output-file: zanadir.md

    - name: Post the report
      run: gh pr comment "$NUMBER" --body-file zanadir.md --edit-last --create-if-none
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NUMBER: ${{ github.event.pull_request.number }}
