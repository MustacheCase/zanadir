rules:
  - id: "jacoco-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Coverage"]
    regex: "(?i)\\bjacoco\\b"

  - id: "cobertura-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Coverage"]
    regex: "(?i)\\bcobertura\\b"

  - id: "codecov-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Coverage"]
    regex: "(?i)\\bcodecov\\b"

  - id: "coverallsapp-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Coverage"]
    regex: "(?i)\\bcoveralls(app)?\\b"

  # Azure's task and the Jenkins coverage plugins' steps.
  - id: "coverage-results-step-rule"
    applyOn: ["Job.Package"]
    categories: ["Coverage"]
    regex: "(?i)^(?:publishcodecoverageresults|recordcoverage|publishcoverage)$"
