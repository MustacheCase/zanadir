rules:
  - id: "syft-rule"
    name: "Syft"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)\\bsyft\\b|anchore/sbom-action"

  - id: "cyclonedx-rule"
    name: "CycloneDX"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)\\bcyclonedx\\b|\\bcdxgen\\b"

  # A bare "spdx" matches the SPDX-License-Identifier header, which appears in
  # workflows that generate no SBOM at all.
  - id: "spdx-tools-rule"
    name: "SPDX tools"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)spdx-sbom-generator|\\bspdx-tools\\b"

  - id: "cosign-rule"
    name: "Cosign"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)\\bcosign\\b"

  # Registry signature and provenance verification: proves installed
  # packages were not tampered with. npm-audit-rule excepts this command
  # so it is not also counted as SCA.
  - id: "npm-audit-signatures-rule"
    name: "npm audit signatures"
    applyOn: ["Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)\\b(?:npm|yarn|pnpm)\\s+audit\\s+signatures\\b"

  - id: "slsa-rule"
    name: "SLSA"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)slsa-framework/|\\bslsa\\b"

  - id: "in-toto-rule"
    name: "in-toto"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)\\bin-toto\\b"

  - id: "github-attestation-rule"
    name: "GitHub Artifact Attestations"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)\\bactions/attest(?:-build-provenance|-sbom)?(?:$|[@\\s])"

  # trivy writes a bill of materials when asked for one as its output format.
  # Its sbom sub-command does the opposite: it scans one, which is SCA.
  - id: "trivy-sbom-rule"
    name: "Trivy"
    applyOn: ["Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)\\btrivy\\b[^\\n]*\\s(?:--format|-f)[= ](?:cyclonedx|spdx|spdx-json)\\b"

  # Signing a release's binaries lets users check where they came from, as
  # Cosign does for images. An ad-hoc codesign (-s -) proves nothing, and
  # notarytool counts only when it submits.
  - id: "os-code-signing-rule"
    applyOn: ["Job.Run"]
    categories: ["Supply Chain"]
    regex: "(?i)(?:^|\\n)(?:xcrun\\s+)?(?P<name>codesign)\\s(?:[^\\n]*\\s)?(?:-s|--sign)[= ]+[^\\s-]|(?:^|\\n)(?:xcrun\\s+)?(?P<name>notarytool)\\s+submit\\b|(?:^|\\n)(?P<name>signtool)(?:\\.exe)?\\s+sign\\b|(?:^|\\n)(?P<name>osslsigncode|rcodesign)\\s+sign\\b"

  - id: "azure-artifact-signing-rule"
    name: "Azure Artifact Signing"
    applyOn: ["Job.Package"]
    categories: ["Supply Chain"]
    regex: "(?i)^azure/(?:trusted|artifact)-signing-action$"

  # Both action names validate the checked-in Gradle wrapper JAR against
  # published checksums. The verification fails the step on an unknown JAR.
  - id: "gradle-wrapper-validation-rule"
    name: "Gradle Wrapper Validation"
    applyOn: ["Job.Package"]
    categories: ["Supply Chain"]
    regex: "(?i)^gradle/(?:actions/wrapper-validation|wrapper-validation-action)$"

  - id: "signpath-rule"
    name: "SignPath"
    applyOn: ["Job.Package"]
    categories: ["Supply Chain"]
    regex: "(?i)^signpath/github-action-submit-signing-request$"

  - id: "esigner-rule"
    name: "SSL.com eSigner"
    applyOn: ["Job.Package"]
    categories: ["Supply Chain"]
    regex: "(?i)^sslcom/esigner-codesign$"
