name: EOL Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  eol-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Build the image
      run: docker build -t zanadir:eol-scan .

    - name: Install Trivy
      env:
        TRIVY_VERSION: 0.75.0
        TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      run: |
        archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
        echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/trivy-bin"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy-bin" trivy
        echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
    - name: Scan the image for end-of-life components
      run: trivy image --exit-on-eol 1 zanadir:eol-scan
