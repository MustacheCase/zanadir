rules:
  - id: "jacoco-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Coverage"]
    regex: "(?i)\\bjacoco\\b"

  - id: "cobertura-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Coverage"]
    regex: "(?i)\\bcobertura\\b"

  - id: "codecov-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Coverage"]
    regex: "(?i)\\bcodecov\\b"

  - id: "coverallsapp-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Coverage"]
    regex: "(?i)\\bcoveralls(app)?\\b"