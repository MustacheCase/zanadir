rules:
  - id: "eslint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\beslint\\b"

  - id: "pylint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bpylint\\b"

  - id: "ruff-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bruff\\b"

  - id: "python-type-checker-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:mypy|pyright)\\b"

  - id: "golangci-lint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgolangci-lint\\b"

  # "revive" is also a plain word (revive-db.sh, revived), so it is matched as a
  # whole path segment. revive exits 0 on findings unless -set_exit_status is
  # given; a -config file can set error-code / warning-code instead.
  - id: "revive-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    # Case-sensitive: Artifact.Name is the workflow name, and "Revive stale
    # issues" is not a Go linter. The revive CLI is always lower case.
    regex: "(?:^|[\\s/])revive(?:[\\s:@/]|$)"
    exitsZeroUnless:
      runMatches: "(?:^|\\s)--?set_exit_status\\b"
      unknownWhen: "(?:^|\\s)--?config(?:[= ]|$)"

  - id: "rubocop-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\brubocop\\b"

  - id: "flake8-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bflake8\\b"

  - id: "oxsecurity-super-linter-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bsuper-linter\\b"

  - id: "hadolint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bhadolint\\b"

  - id: "shellcheck-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bshellcheck\\b"

  - id: "yamllint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\byamllint\\b"

  - id: "markdownlint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bmarkdownlint\\b"

  - id: "actionlint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bactionlint\\b"

  - id: "jsonlint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bjsonlint\\b"

  - id: "php-static-analysis-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:phpstan|psalm)\\b"

  - id: "clang-tidy-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bclang-tidy\\b"

  - id: "biome-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:biome|@biomejs/biome)\\b"

  - id: "oxlint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\boxlint\\b"

  - id: "stylelint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstylelint\\b"

  - id: "prettier-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bprettier\\b"

  - id: "black-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bblack\\b"

  - id: "isort-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bisort\\b"

  - id: "autopep8-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bautopep8\\b"

  - id: "php-cs-fixer-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bphp-cs-fixer\\b"

  - id: "phpcs-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?:^|[\\s/])phpcs(?:[\\s:@/]|$)"

  - id: "golangci-lint-action-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgolangci/golangci-lint-action\\b"

  - id: "helm-lint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bhelm\\s+lint\\b"

  # buf is also used for generation and publishing; only lint and its CI actions count.
  - id: "buf-lint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:\\bbuf\\s+lint\\b|bufbuild/buf(?:-lint)?-action)"
    # buf-action can publish or check breaking changes without linting.
    weakenedWhen:
      - input: "lint"
        equals: "false"
        verdict: "advisory"

  # PHP_CodeSniffer (phpcs). Exits non-zero on violations.
  # Match as a path segment so phpcs.xml config copies do not count.
  - id: "phpcs-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?:^|[\\s/])phpcs(?:[\\s:@/]|$)"
