rules:
  - id: "eslint-rule"
    name: "ESLint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\beslint\\b"

  # HTMLHint is a linter, but its name also appears in config and report paths.
  # Match only commands that execute it, directly or through common package
  # runners. --warn makes findings advisory because HTMLHint exits successfully.
  - id: "htmlhint-rule"
    name: "HTMLHint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?im)^(?:(?:npx|bunx|pnpx|pnpm(?:\\s+(?:exec|dlx))?|yarn(?:\\s+(?:exec|dlx))?|npm\\s+exec|bun\\s+x)(?:\\s+(?:--(?:\\S*)|-\\S+))*\\s+)?(?:\\S*/)?htmlhint(?:@\\S+)?(?:\\s|$)"
    weakenedWhen:
      - runMatches: "(?:^|\\s)--warn(?:\\s|$)"
        verdict: "advisory"

  - id: "pylint-rule"
    name: "Pylint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bpylint\\b"

  - id: "ruff-rule"
    name: "Ruff"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bruff\\b"

  - id: "python-type-checker-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    # "ty" is two letters that turn up inside words and paths (pretty,
    # --bin=ty, target/profiling/ty), so only "ty check" counts, with an
    # optional version as in uvx ty@0.0.1 check. --exit-zero makes ty always
    # exit 0, but --exit-zero-on-warning still fails on errors.
    regex: "(?i)\\b(?:mypy|pyright)\\b|(?:^|[\\s/])(?P<name>ty)(?:@[\\w.-]+)?\\s+check\\b"
    weakenedWhen:
      - runMatches: "--exit-zero(?:\\s|$)"
        verdict: "advisory"

  - id: "golangci-lint-rule"
    name: "golangci-lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgolangci-lint\\b"

  # "revive" is also a plain word (revive-db.sh, revived), so it is matched as a
  # whole path segment. revive exits 0 on findings unless -set_exit_status is
  # given; a -config file can set error-code / warning-code instead.
  - id: "revive-rule"
    name: "revive"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    # Case-sensitive: Artifact.Name is the workflow name, and "Revive stale
    # issues" is not a Go linter. The revive CLI is always lower case.
    regex: "(?:^|[\\s/])revive(?:[\\s:@/]|$)"
    exitsZeroUnless:
      runMatches: "(?:^|\\s)--?set_exit_status\\b"
      unknownWhen: "(?:^|\\s)--?config(?:[= ]|$)"

  - id: "rubocop-rule"
    name: "RuboCop"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\brubocop\\b"

  - id: "flake8-rule"
    name: "Flake8"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bflake8\\b"

  # Vulture finds dead Python code and exits non-zero (3) on findings.
  # Match it only as the program being run (not "vulture:" headings or files
  # like vulture_whitelist.py) or via its GitHub Action.
  - id: "vulture-rule"
    name: "Vulture"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])vulture(?:[\\s@]|$)|(?i)(?:^|\\s)gtkacz/vulture-action(?:[\\s@]|$)"

  - id: "oxsecurity-super-linter-rule"
    applyOn: [ "Artifact.Name", "Job.Package", "Job.Run" ]
    categories: [ "Linter" ]
    regex: "(?i)((?P<name>super-linter)/super-linter|oxsecurity/(?P<name>megalinter))"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-code-quality-template-rule"
    name: "GitLab Code Quality"
    applyOn: ["Job.Package"]
    categories: ["Linter"]
    regex: "(?i)^(?:jobs/)?code-quality\\.gitlab-ci\\.yml$"

  # Jenkins Warnings Next Generation, which publishes linter and static
  # analysis results.
  - id: "jenkins-record-issues-rule"
    name: "Warnings Next Generation"
    applyOn: ["Job.Package"]
    categories: ["Linter"]
    regex: "(?i)^recordissues$"

  # Static analysers for PHP.
  - id: "php-static-analysis-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:phpstan|psalm)\\b"

  - id: "clang-tidy-rule"
    name: "clang-tidy"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bclang-tidy\\b"

  - id: "shellcheck-rule"
    name: "ShellCheck"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bshellcheck\\b"

  - id: "yamllint-rule"
    name: "yamllint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\byamllint\\b"

  - id: "clippy-rule"
    name: "Clippy"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcargo\\s+clippy\\b|clippy-check"

  # Biome's binary is also a common word, so only its commands and action.
  - id: "biome-rule"
    name: "Biome"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bbiome\\s+(?:check|lint|ci)\\b|biomejs/setup-biome"

  - id: "oxlint-rule"
    name: "oxlint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\boxlint\\b"

  - id: "next-lint-rule"
    name: "next lint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bnext\\s+lint\\b"

  - id: "deno-lint-rule"
    name: "deno lint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bdeno\\s+lint\\b"

  - id: "stylelint-rule"
    name: "Stylelint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstylelint\\b"

  - id: "go-vet-rule"
    name: "go vet"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgo\\s+vet\\b"

  - id: "staticcheck-rule"
    name: "Staticcheck"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstaticcheck\\b"

  - id: "kotlin-linter-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:ktlint(?:check)?|detekt)\\b"

  - id: "checkstyle-rule"
    name: "Checkstyle"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcheckstyle(?:main|test)?\\b"

  - id: "swiftlint-rule"
    name: "SwiftLint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bswiftlint\\b"
    # --fix only corrects, and --lenient turns every error into a warning.
    weakenedWhen:
      - runMatches: "(?:^|\\s)--(?:fix|autocorrect|lenient)(?:\\s|$)"
        verdict: "advisory"

  - id: "dart-analyze-rule"
    name: "dart analyze"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:dart|flutter)\\s+analyze\\b"
    # Errors still fail with these, but warnings or infos no longer do.
    weakenedWhen:
      - runMatches: "(?:^|\\s)--no-fatal-(?:warnings|infos)(?:\\s|$)"
        verdict: "partial"

  - id: "hadolint-rule"
    name: "Hadolint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bhadolint\\b"

  - id: "ansible-lint-rule"
    name: "ansible-lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bansible-lint\\b"   

  - id: "chart-testing-rule"
    name: "chart-testing"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bct\\s+lint(?:-and-install)?\\b"

  - id: "markdownlint-rule"
    name: "markdownlint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bmarkdownlint(?:-cli2?)?\\b"

  # `tflint --init` only installs plugins and `tflint -v` prints the version,
  # so neither lints anything.
  - id: "tflint-rule"
    name: "TFLint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\btflint\\b"
    unless: "(?i)^\\S*tflint\\s+(?:--init|-v)$"

  - id: "credo-rule"
    name: "Credo"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bmix\\s+credo\\b"

  - id: "standardrb-rule"
    name: "Standard Ruby"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstandardrb\\b"

  - id: "haskell-lua-linter-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:hlint|luacheck)\\b"

  - id: "vite-plus-lint-rule"
    name: "Vite+ lint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bvp\\s+lint\\b"

  # Helm's lint subcommand validates charts; other helm subcommands do not.
  - id: "helm-lint-rule"
    name: "helm lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bhelm\\s+lint\\b"

  # buf is also used for generation and publishing; only lint and its CI actions count.
  - id: "buf-lint-rule"
    name: "buf lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:\\bbuf\\s+lint\\b|bufbuild/buf(?:-lint)?-action)"
    # buf-action can publish or check breaking changes without linting, or
    # only install buf.
    weakenedWhen:
      - input: "lint"
        equals: "false"
        verdict: "advisory"
      - input: "setup_only"
        equals: "true"
        verdict: "advisory"

  # lychee checks links and exits 2 when one is broken. Its name also turns up
  # in its config (lychee.toml), cache (.lycheecache), release tarballs and the
  # action's report (lychee/out.md), so it only matches as a whole word: after
  # the start, a space or "/", and before a space, ":" (a Docker tag), "@" or
  # the end. The action has its own alternative.
  - id: "lychee-rule"
    name: "lychee"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])lychee(?:[\\s:@]|$)|\\blycheeverse/lychee-action\\b"
    # --dump and --dump-inputs only print the links or inputs, checking none.
    unless: "(?i)(?:^|\\s)--dump(?:-inputs)?(?:\\s|$)"
    # The action's fail input ("Fail entire pipeline on error") defaults to
    # true; with fail: false it only reports.
    weakenedWhen:
      - input: "fail"
        equals: "false"
        verdict: "advisory"

  # awesome_bot checks links and exits 1 on a dead or duplicate one; no flag
  # makes it exit 0. It only matches as a whole word, like lychee, so the
  # awesomebot-gh-summary-action, its URL in a link and awesome_bottom_bar
  # don't. A workflow named after it says nothing, so no Artifact.Name.
  - id: "awesome-bot-rule"
    name: "awesome_bot"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])awesome_bot(?:[\\s:@]|$)"

  # codespell exits non-zero on a misspelling. CSpell (cspell) is a different tool,
  # and .codespellrc / codespell_lib are not runs of it.
  - id: "codespell-rule"
    name: "codespell"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcodespell\\b"
    # actions-codespell reports and always exits 0 when only_warn is set to any value.
    weakenedWhen:
      - input: "only_warn"
        equals: "1"
        verdict: "advisory"
      - input: "only_warn"
        equals: "true"
        verdict: "advisory"

  # CSpell is a different spell checker from codespell. Match it only as the
  # program being run (or its action), not config files, dictionary packages,
  # check-spelling "cspell:" refs, or upgrade/cleanup scripts.
  - id: "cspell-rule"
    name: "CSpell"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?im)^(?:(?:npx|bunx|pnpx|pnpm(?:\\s+(?:exec|dlx))?|yarn(?:\\s+(?:exec|dlx))?|npm\\s+exec|bun\\s+x)(?:\\s+(?:--(?:\\S*)|-\\S+))*\\s+)?(?:\\S*/)?cspell(?:-cli)?(?:@\\S+)?(?:\\s|$)|\\bstreetsidesoftware/cspell-action\\b"
    weakenedWhen:
      - runMatches: "--no-exit-code\\b"
        verdict: "advisory"
      - input: "strict"
        equals: "false"
        verdict: "advisory"

  # Knip finds unused files, dependencies and exports in JS/TS projects and
  # exits non-zero on a finding. "knip" is also a script name (knip:ci),
  # config (knip.json) and cache (node_modules/.cache/knip), so only match it
  # as the program being run: at the start of a command, by path, or right
  # after a package runner, optionally with a version (knip@5). knip-bun is the
  # same tool on Bun.
  - id: "knip-rule"
    name: "Knip"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?im)^(?:(?:npx|bunx|pnpx|pnpm(?:\\s+(?:exec|dlx|run))?|yarn(?:\\s+(?:exec|dlx|run))?|npm\\s+(?:exec|run)|bun\\s+(?:run|x))(?:\\s+(?:--(?:\\S*)|-\\S+))*\\s+)?(?:\\S*/)?knip(?:-bun)?(?:@\\S+)?(?:\\s|$)"
    # --no-exit-code exits 0 on any issue, so it wins when flags are combined.
    # --max-issues <n> with n of 1 or more fails only above a budget, and the
    # fixing flags subtract what Knip repairs. -F is --format, not --fix.
    weakenedWhen:
      - runMatches: "--no-exit-code\\b"
        verdict: "advisory"
      - runMatches: "--max-issues[= ]+[1-9][0-9]*\\b"
        verdict: "partial"
      - runMatches: "(?:^|\\s)(?:--fix(?:-type)?|--allow-remove-files|-f)(?:[\\s=]|$)"
        verdict: "partial"

  - id: "phpcs-rule"
    name: "PHP_CodeSniffer"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])phpcs(?:[\\s:@/]|$)"

  # Formatters in check mode fail when a file is not formatted; without the
  # flag they rewrite files and pass. gofmt is left out: it exits 0 whatever
  # it finds, so it only gates inside a test -z wrapper.
  - id: "formatter-check-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?P<name>cargo\\s+fmt)\\b[^\\n]*\\s--check\\b|\\b(?P<name>rustfmt)\\b[^\\n]*\\s--check\\b|\\b(?P<name>prettier)(?:@\\S+)?\\s(?:[^\\n]*\\s)?(?:--check|-c|--list-different|-l)(?:\\s|$)|\\b(?P<name>black)\\s(?:[^\\n]*\\s)?--check(?:\\s|$)|\\b(?P<name>isort)\\s(?:[^\\n]*\\s)?(?:--check-only|--check|-c)(?:\\s|$)|\\b(?P<name>dotnet\\s+format)\\b[^\\n]*\\s--verify-no-changes\\b|\\b(?P<name>dart\\s+format)\\b[^\\n]*\\s--set-exit-if-changed\\b|\\b(?P<name>(?:terraform|tofu)\\s+fmt)\\b[^\\n]*\\s-check\\b|\\b(?P<name>shfmt)\\s(?:[^\\n]*\\s)?(?:-d|--diff)(?:\\s|$)|\\b(?P<name>clang-format)(?:-\\d+)?\\s[^\\n]*(?:--dry-run|-n)\\s[^\\n]*--Werror\\b|\\b(?P<name>clang-format)(?:-\\d+)?\\s[^\\n]*--Werror\\s[^\\n]*(?:--dry-run|-n)(?:\\s|$)|\\b(?P<name>spotless)(?::check|Check)\\b|\\b(?P<name>dprint)\\s+check\\b|\\b(?P<name>oxfmt)\\b[^\\n]*\\s--check\\b|\\b(?P<name>mix\\s+format)\\b[^\\n]*\\s--check-formatted\\b|\\b(?P<name>deno\\s+fmt)\\b[^\\n]*\\s--check\\b|^(?P<name>dprint)/check$|^DoozyX/(?P<name>clang-format)-lint-action$"

  # pre-commit and prek run whatever hooks the config lists, counted as linting
  # without reading the config. prek runs the hooks when given no subcommand.
  - id: "pre-commit-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?P<name>pre-commit)\\s+run\\b|(?:^|\\n)(?:\\S*/)?(?P<name>prek)(?:\\s+(?:run\\b|-|[\\\"'$])|[ \\t]*(?:\\n|$))|^(?P<name>pre-commit)/action$|^j178/(?P<name>prek)-action$"
    # Without a file selection only staged files are checked, and a CI
    # checkout has none, so every hook is skipped.
    exitsZeroUnless:
      runMatches: "(?:^|\\s)(?:--all-files|-a|--files|--glob|--directory|-d|--from-ref|--source|-s|--to-ref|--origin|-o|--last-commit)(?:[=\\s]|$)"
      unknownWhen: "\\$"

  # tsc is as often the build as a check, so only --noEmit says "check,
  # don't write". vue-tsc type-checks Vue single-file components and tsgo is
  # TypeScript's native preview compiler; both take the flag. tsc-alias and
  # --noEmitOnError are not it.
  - id: "typescript-noemit-rule"
    name: "TypeScript"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])(?:tsc|vue-tsc|tsgo)[^\\S\\n](?:[^\\n]*[^\\S\\n])?--noemit\\b"

  # typos (crate-ci) exits 2 on a spelling error. "typos" is an ordinary word,
  # so the regex keeps it only where it is run: at the start of a command or
  # after a space, or after a "/", which covers a path (./bin/typos) and the
  # action (crate-ci/typos@v1.48.0), and before whitespace, "@" or the end.
  # A workflow's name is prose (supabase has an "Automatically fix typos"
  # workflow that runs misspell-fixer), so Artifact.Name stays out.
  - id: "typos-rule"
    name: "typos"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/\"'])(?P<name>typos)(?:@[\\w.-]+)?(?:\\s|$)"
    # CSpell reports typos: --report typos / --report=typos is its output
    # flag, not a run of the typos spell checker.
    unless: "(?i)(?:^|\\s)--report(?:\\s|=)typos(?:\\s|$)"
    # -w / --write-changes fixes every typo that has a single correction and
    # only fails on the rest, so it is a fixer, not a check; the action's
    # write_changes input does the same when set to true.
    weakenedWhen:
      - runMatches: "(?i)(?:^|\\s)(?:-w|--write-changes)(?:\\s|$)"
        verdict: "advisory"
      - input: "write_changes"
        equals: "true"
        verdict: "advisory"
