rules:
  - id: "fossa-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["License Compliance"]
    regex: "(?i)\\bfossa\\b"

  - id: "licensefinder-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["License Compliance"]
    regex: "(?i)\\blicense[-_]?finder\\b"

  - id: "grant-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["License Compliance"]
    regex: "(?i)\\banchore/grant\\b|\\bgrant\\s+(?:check|list)\\b"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-license-scanning-template-rule"
    applyOn: ["Job.Package"]
    categories: ["License Compliance"]
    regex: "(?i)^(?:jobs|security)/license-scanning(?:\\.latest)?\\.gitlab-ci\\.yml$"

  - id: "bouncer-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["License Compliance"]
    regex: "(?i)\\bbouncer\\s+(?:check|list)\\b|wagoodman/go-bouncer"

  - id: "reuse-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["License Compliance"]
    regex: "(?i)\\breuse\\s+lint\\b|fsfe/reuse-action"

  # cargo deny check runs every check unless it is given some; licenses is
  # one of them. Its action runs check by default too.
  - id: "cargo-deny-licenses-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["License Compliance"]
    regex: "(?i)\\bcargo[\\s-]deny\\b[^\\n]*\\bcheck\\b|embarkstudios/cargo-deny-action"
    unless: "(?i)\\bcheck\\s+(?:(?:advisories|bans|sources)\\s*)+$"
