name: Agent Skill Security

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  skill-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The step fixer/templates.yaml suggests, unchanged, so CI checks it too.
    - name: Scan agent skills
      run: pipx run --spec cisco-ai-skill-scanner==2.3.1 skill-scanner scan-all . --recursive --fail-on-severity high

  skillspector:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # SkillSpector needs Python 3.12 or 3.13 for prebuilt YARA wheels; the
    # runner image's own Python is newer.
    - name: Set up Python
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    # SkillSpector is not on PyPI: v2.13.6 is installed from its release commit.
    # --no-llm keeps it to static analysis, which needs no model credentials.
    - name: Scan the plugin with SkillSpector
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: >-
        pipx run --python "$PYTHON"
        --spec git+https://github.com/NVIDIA/SkillSpector.git@e2674da339b0bddc6e565d059c0577c6d9cd25da
        skillspector scan plugins/zanadir --no-llm --fail-on-findings --fail-on-incomplete
        --baseline .github/skillspector-baseline.yaml

    # The edition submitted to the plugin directory, which has no launcher and
    # so needs no baseline.
    - name: Scan the directory edition with SkillSpector
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
      run: >-
        pipx run --python "$PYTHON"
        --spec git+https://github.com/NVIDIA/SkillSpector.git@e2674da339b0bddc6e565d059c0577c6d9cd25da
        skillspector scan directory/zanadir --no-llm --fail-on-findings --fail-on-incomplete
