name: Workflow Security

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Audit the workflows
      uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        # Fail the job on findings and annotate them on the pull request. With
        # the default (true) it uploads SARIF and passes whatever it finds.
        advanced-security: false
        annotations: true
