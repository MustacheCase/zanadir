name: Secrets Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Secret Scanning
      uses: trufflesecurity/trufflehog@27d8ea2876d990b274996fc97aff0f8d952d364c # main
      with:
        extra_args: --results=verified,unknown