rules:
  - id: "eslint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\beslint\\b"

  - id: "pylint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bpylint\\b"

  - id: "ruff-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bruff\\b"

  - id: "python-type-checker-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:mypy|pyright)\\b"

  - id: "golangci-lint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgolangci-lint\\b"

  - id: "rubocop-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\brubocop\\b"

  - id: "flake8-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bflake8\\b"

  - id: "oxsecurity-super-linter-rule"
    applyOn: [ "Artifact.Name", "Job.Package", "Job.Run" ]
    categories: [ "Linter" ]
    regex: "(?i)(super-linter/super-linter|oxsecurity/megalinter)"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-code-quality-template-rule"
    applyOn: ["Job.Package"]
    categories: ["Linter"]
    regex: "(?i)^(?:jobs/)?code-quality\\.gitlab-ci\\.yml$"

  # Jenkins Warnings Next Generation, which publishes linter and static
  # analysis results.
  - id: "jenkins-record-issues-rule"
    applyOn: ["Job.Package"]
    categories: ["Linter"]
    regex: "(?i)^recordissues$"

  # Static analysers for PHP.
  - id: "php-static-analysis-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:phpstan|psalm)\\b"

  - id: "clang-tidy-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bclang-tidy\\b"

  - id: "shellcheck-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bshellcheck\\b"

  - id: "clippy-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcargo\\s+clippy\\b|clippy-check"

  # Biome's binary is also a common word, so only its commands and action.
  - id: "biome-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bbiome\\s+(?:check|lint|ci)\\b|biomejs/setup-biome"

  - id: "oxlint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\boxlint\\b"

  - id: "next-lint-rule"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bnext\\s+lint\\b"

  - id: "deno-lint-rule"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bdeno\\s+lint\\b"

  - id: "stylelint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstylelint\\b"

  - id: "go-vet-rule"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgo\\s+vet\\b"

  - id: "staticcheck-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstaticcheck\\b"

  - id: "kotlin-linter-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:ktlint(?:check)?|detekt)\\b"

  - id: "checkstyle-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcheckstyle(?:main|test)?\\b"

  - id: "swiftlint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bswiftlint\\b"

  - id: "dart-analyze-rule"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:dart|flutter)\\s+analyze\\b"

  - id: "hadolint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bhadolint\\b"

  - id: "credo-rule"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bmix\\s+credo\\b"

  - id: "standardrb-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstandardrb\\b"

  - id: "haskell-lua-linter-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:hlint|luacheck)\\b"
