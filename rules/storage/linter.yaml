rules:
  - id: "eslint-rule"
    name: "ESLint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\beslint\\b"

  # HTMLHint is a linter, but its name also appears in config and report paths.
  # Match only commands that execute it, directly or through common package
  # runners. --warn makes findings advisory because HTMLHint exits successfully.
  - id: "htmlhint-rule"
    name: "HTMLHint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?im)^(?:(?:npx|bunx|pnpx|pnpm(?:\\s+(?:exec|dlx))?|yarn(?:\\s+(?:exec|dlx))?|npm\\s+exec|bun\\s+x)(?:\\s+(?:--(?:\\S*)|-\\S+))*\\s+)?(?:\\S*/)?htmlhint(?:@\\S+)?(?:\\s|$)"
    weakenedWhen:
      - runMatches: "(?:^|\\s)--warn(?:\\s|$)"
        verdict: "advisory"

  - id: "pylint-rule"
    name: "Pylint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bpylint\\b"

  - id: "ruff-rule"
    name: "Ruff"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bruff\\b"

  - id: "python-type-checker-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    # "ty" is two letters that turn up inside words and paths (pretty,
    # --bin=ty, target/profiling/ty), so only "ty check" counts, with an
    # optional version as in uvx ty@0.0.1 check. --exit-zero makes ty always
    # exit 0, but --exit-zero-on-warning still fails on errors.
    # basedpyright and pyrefly are bounded the same way: file names hold both
    # (.basedpyright/baseline.json, pyrefly_diff.txt, ./dev/pyrefly-check-local),
    # and only "pyrefly check" checks code (init, lsp, infer, suppress and
    # coverage report do not). The action's Job.Package is the whole text.
    regex: "(?i)\\b(?:mypy|pyright)\\b|(?:^|[\\s/])(?P<name>ty)(?:@[\\w.-]+)?\\s+check\\b|(?:^|[\\s/])(?P<name>basedpyright)(?:@[\\w.-]+)?(?:\\s|$)|(?:^|[\\s/])(?P<name>pyrefly)(?:@[\\w.-]+)?\\s+check\\b|^(?:facebook|meta)/(?P<name>pyrefly)$"
    weakenedWhen:
      - runMatches: "--exit-zero(?:\\s|$)"
        verdict: "advisory"

  - id: "golangci-lint-rule"
    name: "golangci-lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgolangci-lint\\b"

  # "revive" is also a plain word (revive-db.sh, revived), so it is matched as a
  # whole path segment. revive exits 0 on findings unless -set_exit_status is
  # given; a -config file can set error-code / warning-code instead.
  - id: "revive-rule"
    name: "revive"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    # Case-sensitive: Artifact.Name is the workflow name, and "Revive stale
    # issues" is not a Go linter. The revive CLI is always lower case.
    regex: "(?:^|[\\s/])revive(?:[\\s:@/]|$)"
    exitsZeroUnless:
      runMatches: "(?:^|\\s)--?set_exit_status\\b"
      unknownWhen: "(?:^|\\s)--?config(?:[= ]|$)"

  - id: "rubocop-rule"
    name: "RuboCop"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\brubocop\\b"

  - id: "flake8-rule"
    name: "Flake8"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bflake8\\b"

  # Vulture finds dead Python code and exits non-zero (3) on findings.
  # Match it only as the program being run (not "vulture:" headings or files
  # like vulture_whitelist.py) or via its GitHub Action.
  - id: "vulture-rule"
    name: "Vulture"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])vulture(?:[\\s@]|$)|(?i)(?:^|\\s)gtkacz/vulture-action(?:[\\s@]|$)"

  # interrogate exits 1 when docstring coverage is below --fail-under (default
  # 80). A threshold of zero can never fail. Match the word only as the program:
  # "interrogate" also names scripts, badges and reports.
  - id: "interrogate-rule"
    name: "interrogate"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])interrogate(?:\\s|@|==|$)|(?i)(?:^|\\s)[\\w.-]+/python-interrogate-check(?:[\\s@]|$)"
    weakenedWhen:
      - runMatches: "(?:^|\\s)(?:--fail-under[= ]+|-f[= ]?)0+(?:\\.0+)?(?:\\s|$)"
        verdict: "advisory"
      - input: "fail-under"
        equals: "0"
        verdict: "advisory"

  # Scalafix runs the rules in .scalafix.conf, through sbt-scalafix's scalafix
  # and scalafixAll tasks, a scalafixCheck(All) alias, mill-scalafix's fix
  # command or the CLI. With --check (or --test) a pending rewrite fails the
  # run; without it rewrites are applied and only a linter rule's finding
  # fails, which the command doesn't show, so that run is unknown. sbt task
  # names are case-sensitive. Each form is tied to the program the command
  # runs (sbt, mill, scalafix, cs launch), so cd scalafix, a clone of its repo
  # or ./mill __.compile fix is not a run; cs install/fetch only download it.
  - id: "scalafix-rule"
    name: "scalafix"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?m)(?:^|\\s)(?:\\S*/)?sbtn?\\s(?:[^\\n]*[\\s\"';+/:])?scalafix(?:All|Check|CheckAll)?(?:[\\s\"';]|$)|^(?:\\S*/)?scalafix(?:\\s|$)|^(?:\\S*/)?(?:cs|coursier)\\s+launch\\s+(?:-\\S+\\s+)*scalafix(?:[\\s:]|$)|^(?:\\S*/)?mill(?:w|\\.bat)?(?:\\s+-\\S+(?:\\s+\\d+)?)*\\s+(?:all\\s(?:[^\\n]*\\s)?|[^\\n]*\\s\\+\\s+)?[\"']?(?:[^\\s\"']*[.\\]])?fix[\"']?(?:[\\s+]|$)"
    exitsZeroUnless:
      runMatches: "(?:^|[\\s\"';+/:.\\]])(?:scalafix(?:All)?(?::\\S+)?|fix[\"']?)\\s(?:[^;\"'+\\n]*\\s)?--(?:check|test)(?:[\\s\"';+]|$)|scalafixCheck"
      unknownWhen: "scalafix|fix"

  # cargo-machete reports dependencies in Cargo.toml that the code never uses.
  # It exits 1 on findings, so it always fails the step as it is. Match it as
  # the cargo sub-command (with an optional toolchain) or as its own name with
  # the boundaries of a program or image: ~/.cargo/bin/cargo-machete,
  # bnjbvr/cargo-machete, ghcr.io/bnjbvr/cargo-machete:latest. Not the
  # metadata tables, workflow files or release archive names.
  # Case-sensitive: the tool, its sub-command and the hook id are lower case.
  - id: "cargo-machete-rule"
    name: "cargo-machete"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?:^|[\\s/])cargo\\s+(?:\\+\\S+\\s+)?machete(?:\\s|$)|(?:^|[\\s/])cargo-machete(?:[\\s:@]|$)"

  # cargo-udeps reports dependencies the build never uses. It exits 1 on
  # findings, and on a stable toolchain it stops with an error, so it fails
  # the step as it is. Match the cargo sub-command (with an optional
  # toolchain), the binary as "cargo-udeps udeps", or its pre-commit hook id
  # "udeps" as a whole command. "cargo-udeps" alone names release archives and
  # Cargo.toml metadata, so it does not count.
  - id: "cargo-udeps-rule"
    name: "cargo-udeps"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?m)(?:^|[\\s/])cargo\\s+(?:\\+\\S+\\s+)?udeps(?:\\s|$)|^cargo-udeps\\s+udeps(?:\\s|$)|^udeps(?:\\s|$)"

  - id: "oxsecurity-super-linter-rule"
    applyOn: [ "Artifact.Name", "Job.Package", "Job.Run" ]
    categories: [ "Linter" ]
    # Bound the old Super-linter name to skip .github/super-linter.env.
    regex: "(?i)((?P<name>super-linter)/super-linter|oxsecurity/(?P<name>megalinter)|(?:^|[\\s/])github/(?P<name>super-linter)(?:[\\s:@/]|$)|megalinter/(?P<name>megalinter)|nvuillam/(?P<name>mega-linter))"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-code-quality-template-rule"
    name: "GitLab Code Quality"
    applyOn: ["Job.Package"]
    categories: ["Linter"]
    regex: "(?i)^(?:jobs/)?code-quality\\.gitlab-ci\\.yml$"

  # Jenkins Warnings Next Generation, which publishes linter and static
  # analysis results.
  - id: "jenkins-record-issues-rule"
    name: "Warnings Next Generation"
    applyOn: ["Job.Package"]
    categories: ["Linter"]
    regex: "(?i)^recordissues$"

  # Static analysers for PHP.
  - id: "php-static-analysis-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:phpstan|psalm)\\b"

  - id: "clang-tidy-rule"
    name: "clang-tidy"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bclang-tidy\\b"

  - id: "shellcheck-rule"
    name: "ShellCheck"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bshellcheck\\b"

  - id: "yamllint-rule"
    name: "yamllint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\byamllint\\b"

  - id: "clippy-rule"
    name: "Clippy"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcargo\\s+clippy\\b|clippy-check"

  # Biome's binary is also a common word, so only its commands and action.
  - id: "biome-rule"
    name: "Biome"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bbiome\\s+(?:check|lint|ci)\\b|biomejs/setup-biome"

  - id: "oxlint-rule"
    name: "oxlint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\boxlint\\b"

  - id: "next-lint-rule"
    name: "next lint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bnext\\s+lint\\b"

  - id: "deno-lint-rule"
    name: "deno lint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bdeno\\s+lint\\b"

  # Taplo validates TOML with check/lint/validate. Its fmt/format sub-command
  # rewrites files and exits 0 unless --check is given (--diff alone still
  # rewrites), so that form counts only with --check later on the line.
  - id: "taplo-rule"
    name: "Taplo"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/\"'])(?:@taplo/cli|taplo)(?:@[0-9][\\w.-]*|==[0-9][\\w.-]*)?\\s+(?:(?:check|lint|validate)|(?:fmt|format)(?:\\s[^\\n]*)?\\s--check)(?:[\\s\"']|$)"

  - id: "stylelint-rule"
    name: "Stylelint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstylelint\\b"

  - id: "go-vet-rule"
    name: "go vet"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgo\\s+vet\\b"

  - id: "staticcheck-rule"
    name: "Staticcheck"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstaticcheck\\b"

  - id: "kotlin-linter-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:ktlint(?:check)?|detekt)\\b"

  - id: "checkstyle-rule"
    name: "Checkstyle"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcheckstyle(?:main|test)?\\b"

  - id: "swiftlint-rule"
    name: "SwiftLint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bswiftlint\\b"
    # --fix only corrects, and --lenient turns every error into a warning.
    weakenedWhen:
      - runMatches: "(?:^|\\s)--(?:fix|autocorrect|lenient)(?:\\s|$)"
        verdict: "advisory"

  - id: "dart-analyze-rule"
    name: "dart analyze"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:dart|flutter)\\s+analyze\\b"
    # Errors still fail with these, but warnings or infos no longer do.
    weakenedWhen:
      - runMatches: "(?:^|\\s)--no-fatal-(?:warnings|infos)(?:\\s|$)"
        verdict: "partial"

  - id: "hadolint-rule"
    name: "Hadolint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bhadolint\\b"

  - id: "sqlfluff-rule"
    name: "SQLFluff"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bsqlfluff\\s+lint\\b"
    weakenedWhen:
      - runMatches: "--nofail(?:\\s|$)"
        verdict: "advisory"

  - id: "ansible-lint-rule"
    name: "ansible-lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bansible-lint\\b"   

  - id: "chart-testing-rule"
    name: "chart-testing"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bct\\s+lint(?:-and-install)?\\b"

  - id: "markdownlint-rule"
    name: "markdownlint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bmarkdownlint(?:-cli2?)?\\b"

  # `tflint --init` only installs plugins and `tflint -v` prints the version,
  # so neither lints anything.
  - id: "tflint-rule"
    name: "TFLint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\btflint\\b"
    unless: "(?i)^\\S*tflint\\s+(?:--init|-v)$"

  - id: "credo-rule"
    name: "Credo"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bmix\\s+credo\\b"

  - id: "standardrb-rule"
    name: "Standard Ruby"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstandardrb\\b"

  - id: "haskell-lua-linter-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:hlint|luacheck)\\b"

  - id: "vite-plus-lint-rule"
    name: "Vite+ lint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bvp\\s+lint\\b"

  # Helm's lint subcommand validates charts; other helm subcommands do not.
  - id: "helm-lint-rule"
    name: "helm lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bhelm\\s+lint\\b"

  # buf is also used for generation and publishing; only lint and its CI actions count.
  - id: "buf-lint-rule"
    name: "buf lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:\\bbuf\\s+lint\\b|bufbuild/buf(?:-lint)?-action)"
    # buf-action can publish or check breaking changes without linting, or
    # only install buf.
    weakenedWhen:
      - input: "lint"
        equals: "false"
        verdict: "advisory"
      - input: "setup_only"
        equals: "true"
        verdict: "advisory"

  # buf breaking fails on a breaking schema change; the other buf subcommands
  # do not. Only a real invocation counts, so the whitespace between buf and
  # breaking is horizontal only (two commands on separate lines never combine)
  # and the boundaries around both words keep my-buf, buf breaking-change,
  # make buf-breaking and prose names out. A :tag or @version after buf covers
  # Docker images and go run / npx runners. The two buf actions match as a
  # whole line, which keeps buf-lint-action, buf-setup-action, forks and
  # repository URLs in shell commands out.
  - id: "buf-breaking-rule"
    name: "buf breaking"
    # Artifact.Name is omitted on purpose: prose names don't prove execution.
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?im)(?:(?:^|[\\s/\"'(])buf(?:[:@][^\\s/\"']+)?[ \\t]+breaking(?:$|[\\s\"'|;&)])|^bufbuild/buf(?:-breaking)?-action(?:@\\S+)?$)"
    # breaking: false or setup_only: true leaves the step without a breaking
    # check, or installing buf only.
    weakenedWhen:
      - input: "breaking"
        equals: "false"
        verdict: "advisory"
      - input: "setup_only"
        equals: "true"
        verdict: "advisory"

  # lychee checks links and exits 2 when one is broken. Its name also turns up
  # in its config (lychee.toml), cache (.lycheecache), release tarballs and the
  # action's report (lychee/out.md), so it only matches as a whole word: after
  # the start, a space or "/", and before a space, ":" (a Docker tag), "@" or
  # the end. The action has its own alternative.
  - id: "lychee-rule"
    name: "lychee"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])lychee(?:[\\s:@]|$)|\\blycheeverse/lychee-action\\b"
    # --dump and --dump-inputs only print the links or inputs, checking none.
    unless: "(?i)(?:^|\\s)--dump(?:-inputs)?(?:\\s|$)"
    # The action's fail input ("Fail entire pipeline on error") defaults to
    # true; with fail: false it only reports.
    weakenedWhen:
      - input: "fail"
        equals: "false"
        verdict: "advisory"

  # Match the command or either action, not config paths or workflow/job names.
  # Token boundaries exclude filenames like markdown-link-check-config.json.
  - id: "markdown-link-check-rule"
    name: "markdown-link-check"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])markdown-link-check(?:[\\s:@]|$)|(?:^|\\s)(?:tcort|gaurav-nelson)/github-action-markdown-link-check(?:[\\s@]|$)"

  # awesome_bot checks links and exits 1 on a dead or duplicate one; no flag
  # makes it exit 0. It only matches as a whole word, like lychee, so the
  # awesomebot-gh-summary-action, its URL in a link and awesome_bottom_bar
  # don't. A workflow named after it says nothing, so no Artifact.Name.
  - id: "awesome-bot-rule"
    name: "awesome_bot"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])awesome_bot(?:[\\s:@]|$)"

  # codespell exits non-zero on a misspelling. CSpell (cspell) is a different tool,
  # and .codespellrc / codespell_lib are not runs of it.
  - id: "codespell-rule"
    name: "codespell"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcodespell\\b"
    # actions-codespell reports and always exits 0 when only_warn is set to any value.
    weakenedWhen:
      - input: "only_warn"
        equals: "1"
        verdict: "advisory"
      - input: "only_warn"
        equals: "true"
        verdict: "advisory"

  # CSpell is a different spell checker from codespell. Match it only as the
  # program being run (or its action), not config files, dictionary packages,
  # check-spelling "cspell:" refs, or upgrade/cleanup scripts.
  - id: "cspell-rule"
    name: "CSpell"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?im)^(?:(?:npx|bunx|pnpx|pnpm(?:\\s+(?:exec|dlx))?|yarn(?:\\s+(?:exec|dlx))?|npm\\s+exec|bun\\s+x)(?:\\s+(?:--(?:\\S*)|-\\S+))*\\s+)?(?:\\S*/)?cspell(?:-cli)?(?:@\\S+)?(?:\\s|$)|\\bstreetsidesoftware/cspell-action\\b"
    weakenedWhen:
      - runMatches: "--no-exit-code\\b"
        verdict: "advisory"
      - input: "strict"
        equals: "false"
        verdict: "advisory"

  # Knip finds unused files, dependencies and exports in JS/TS projects and
  # exits non-zero on a finding. "knip" is also a script name (knip:ci),
  # config (knip.json) and cache (node_modules/.cache/knip), so only match it
  # as the program being run: at the start of a command, by path, or right
  # after a package runner, optionally with a version (knip@5). knip-bun is the
  # same tool on Bun.
  - id: "knip-rule"
    name: "Knip"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?im)^(?:(?:npx|bunx|pnpx|pnpm(?:\\s+(?:exec|dlx|run))?|yarn(?:\\s+(?:exec|dlx|run))?|npm\\s+(?:exec|run)|bun\\s+(?:run|x))(?:\\s+(?:--(?:\\S*)|-\\S+))*\\s+)?(?:\\S*/)?knip(?:-bun)?(?:@\\S+)?(?:\\s|$)"
    # --no-exit-code exits 0 on any issue, so it wins when flags are combined.
    # --max-issues <n> with n of 1 or more fails only above a budget, and the
    # fixing flags subtract what Knip repairs. -F is --format, not --fix.
    weakenedWhen:
      - runMatches: "--no-exit-code\\b"
        verdict: "advisory"
      - runMatches: "--max-issues[= ]+[1-9][0-9]*\\b"
        verdict: "partial"
      - runMatches: "(?:^|\\s)(?:--fix(?:-type)?|--allow-remove-files|-f)(?:[\\s=]|$)"
        verdict: "partial"

  - id: "phpcs-rule"
    name: "PHP_CodeSniffer"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])phpcs(?:[\\s:@/]|$)"

  # Formatters in check mode fail when a file is not formatted; without the
  # flag they rewrite files and pass. gofmt is left out: it exits 0 whatever
  # it finds, so it only gates inside a test -z wrapper.
  - id: "formatter-check-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?P<name>cargo\\s+fmt)\\b[^\\n]*\\s--check\\b|\\b(?P<name>rustfmt)\\b[^\\n]*\\s--check\\b|\\b(?P<name>prettier)(?:@\\S+)?\\s(?:[^\\n]*\\s)?(?:--check|-c|--list-different|-l)(?:\\s|$)|\\b(?P<name>black)\\s(?:[^\\n]*\\s)?--check(?:\\s|$)|\\b(?P<name>isort)\\s(?:[^\\n]*\\s)?(?:--check-only|--check|-c)(?:\\s|$)|\\b(?P<name>dotnet\\s+format)\\b[^\\n]*\\s--verify-no-changes\\b|\\b(?P<name>dart\\s+format)\\b[^\\n]*\\s--set-exit-if-changed\\b|\\b(?P<name>(?:terraform|tofu)\\s+fmt)\\b[^\\n]*\\s-check\\b|\\b(?P<name>shfmt)\\s(?:[^\\n]*\\s)?(?:-d|--diff)(?:\\s|$)|\\b(?P<name>clang-format)(?:-\\d+)?\\s[^\\n]*(?:--dry-run|-n)\\s[^\\n]*--Werror\\b|\\b(?P<name>clang-format)(?:-\\d+)?\\s[^\\n]*--Werror\\s[^\\n]*(?:--dry-run|-n)(?:\\s|$)|\\b(?P<name>spotless)(?::check|Check)\\b|\\b(?P<name>dprint)\\s+check\\b|\\b(?P<name>oxfmt)\\b[^\\n]*\\s--check\\b|\\b(?P<name>mix\\s+format)\\b[^\\n]*\\s--check-formatted\\b|\\b(?P<name>deno\\s+fmt)\\b[^\\n]*\\s--check\\b|^(?P<name>dprint)/check$|^DoozyX/(?P<name>clang-format)-lint-action$"

  # StyLua formats Lua and Luau. Plain stylua rewrites the files and exits 0;
  # only --check (-c) fails when a file needs formatting. The action runs
  # stylua with its args input, which has no default, so it is a check only
  # when args has the flag. Match the command only as the program being run
  # (at the start, by path, or behind npx and the like) so download and
  # chmod steps that name the binary stay out.
  - id: "stylua-rule"
    name: "StyLua"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?im)^(?:(?:npx|bunx|pnpx|pnpm\\s+(?:exec|dlx)|yarn(?:\\s+dlx)?|npm\\s+exec|xargs)(?:\\s+-\\S*)*\\s+)?(?:(?:\\S*/)?stylua|@johnnymorganz/stylua-bin)(?:@\\S+)?(?:\\s|$)|(?i)^JohnnyMorganz/stylua-action(?:@\\S*)?$"
    exitsZeroUnless:
      input: "args"
      runMatches: "(?:^|\\s)(?:--check|-c)(?:\\s|$)"
      # StyLua's own hooks run it without --check, and pre-commit fails a
      # hook that changes a file.
      hookRewrites: true

  # pre-commit and prek run whatever hooks the config lists, counted as linting
  # without reading the config. prek runs the hooks when given no subcommand.
  - id: "pre-commit-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?P<name>pre-commit)\\s+run\\b|(?:^|\\n)(?:\\S*/)?(?P<name>prek)(?:\\s+(?:run\\b|-|[\\\"'$])|[ \\t]*(?:\\n|$))|^(?P<name>pre-commit)/action$|^j178/(?P<name>prek)-action$"
    # Without a file selection only staged files are checked, and a CI
    # checkout has none, so every hook is skipped. pre-commit takes any unique
    # prefix of a long option (--all) and short flags together (-av).
    exitsZeroUnless:
      runMatches: "(?:^|\\s)(?:--a(?:l(?:l(?:-(?:f(?:i(?:l(?:es?)?)?)?)?)?)?)?|--fi(?:l(?:es?)?)?|--fr(?:o(?:m(?:-(?:r(?:ef?)?)?)?)?)?|--so(?:u(?:r(?:ce?)?)?)?|--t(?:o(?:-(?:r(?:ef?)?)?)?)?|--o(?:r(?:i(?:g(?:in?)?)?)?)?|--glob|--directory|--last-commit|-[vq]*[asod]\\S*)(?:[=\\s\\\"';&|)]|$)"
      unknownWhen: "\\$"

  # tsc is as often the build as a check, so only --noEmit says "check,
  # don't write". vue-tsc type-checks Vue single-file components and tsgo is
  # TypeScript's native preview compiler; both take the flag. tsc-alias and
  # --noEmitOnError are not it.
  - id: "typescript-noemit-rule"
    name: "TypeScript"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])(?:tsc|vue-tsc|tsgo)[^\\S\\n](?:[^\\n]*[^\\S\\n])?--noemit\\b"

  # typos (crate-ci) exits 2 on a spelling error. "typos" is an ordinary word,
  # so the regex keeps it only where it is run: at the start of a command or
  # after a space, or after a "/", which covers a path (./bin/typos) and the
  # action (crate-ci/typos@v1.48.0), and before whitespace, "@" or the end.
  # A workflow's name is prose (supabase has an "Automatically fix typos"
  # workflow that runs misspell-fixer), so Artifact.Name stays out.
  - id: "typos-rule"
    name: "typos"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/\"'])(?P<name>typos)(?:@[\\w.-]+)?(?:\\s|$)"
    # CSpell reports typos: --report typos / --report=typos is its output
    # flag, not a run of the typos spell checker.
    unless: "(?i)(?:^|\\s)--report(?:\\s|=)typos(?:\\s|$)"
    # -w / --write-changes fixes every typo that has a single correction and
    # only fails on the rest, so it is a fixer, not a check; the action's
    # write_changes input does the same when set to true.
    weakenedWhen:
      - runMatches: "(?i)(?:^|\\s)(?:-w|--write-changes)(?:\\s|$)"
        verdict: "advisory"
      - input: "write_changes"
        equals: "true"
        verdict: "advisory"

  # terraform-docs writes updated READMEs and exits 0 by default; only
  # --output-check makes the CLI fail on a stale README.
  - id: "terraform-docs-rule"
    name: "terraform-docs"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?im)^(?:(?:if|elif|while|until|then|do|else)\\s+|!\\s+)*terraform-docs(?:\\s|$)|\\bterraform-docs/terraform-docs(?:[:@\\s]|$)"
    exitsZeroUnless:
      runMatches: "(?i)(?:^|\\s)--output-check(?:=true)?(?:\\s|$)"

  - id: "terraform-docs-action-rule"
    name: "terraform-docs"
    applyOn: ["Job.Package"]
    categories: ["Linter"]
    regex: "(?i)^terraform-docs/gh-actions$"
    exitsZeroUnless:
      input: "fail-on-diff"
      runMatches: "(?i)^true$"
    weakenedWhen:
      - input: "git-push"
        equals: "true"
        verdict: "advisory"

  # check-jsonschema validates JSON, YAML and TOML against JSON Schemas.
  # It exits 1 on errors and runs either directly, through runners (uvx, uv run,
  # pipx run, python -m), or as official pre-commit hooks (check-github-workflows,
  # check-dependabot, check-metaschema, etc.).
  - id: "check-jsonschema-rule"
    name: "check-jsonschema"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?im)^(?:(?:(?:uvx|pipx\\s+run|uv\\s+run|xargs)(?:\\s+-\\S*)*\\s+)?(?:\\S*/)?check-jsonschema(?:(?:==|@)\\S+)?|(?:python3?|py)(?:\\s+-\\S+)*\\s+-m\\s+check_jsonschema|check-(?:metaschema|azure-pipelines|bamboo-spec|bitbucket-pipelines|buildkite|changie|circle-ci|citation-file-format|cloudbuild|codecov|compose-spec|dependabot|drone-ci|github-(?:actions|discussion|issue-config|issue-forms|workflows(?:-require-timeout)?)|gitlab-ci|meltano|mergify|readthedocs|renovate|snapcraft|taskfile|travis|woodpecker-ci))(?:\\s|$)"
