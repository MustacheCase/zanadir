name: EOL Scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  eol-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build the image
      run: docker build -t zanadir:eol-scan .

    - name: Set up Trivy
      uses: aquasecurity/setup-trivy@v0.3.1

    - name: Scan the image for end-of-life components
      run: trivy image --exit-on-eol 1 zanadir:eol-scan
