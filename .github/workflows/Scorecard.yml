name: Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Publishing the results (for the README badge) is rejected unless this
    # job runs only allow-listed actions, has no env, and is the only job with
    # id-token: write.
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run Scorecard
      uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: results.json
        results_format: json
        publish_results: true
