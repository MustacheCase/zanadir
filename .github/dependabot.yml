# Actions are pinned to commit SHAs, which the Workflow Security audit
# requires. Nothing would ever update them without this.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Minor and patch updates share one pull request; a major update gets its
  # own, so one breaking API change cannot hold the rest back.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go:
        update-types: ["minor", "patch"]
