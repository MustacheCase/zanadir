name: Build and Push to Docker Hub on Release (Main Branch)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure release is from the main branch
        if: ${{ github.event.release.target_commitish == 'main' }}
        run: echo "Release is from the main branch."

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One tag for both architectures, so Apple Silicon and ARM runners pull a
      # native image instead of emulating amd64.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            mustachecase/zanadir:${{ github.ref_name }}
            mustachecase/zanadir:latest

  # Lists the new image in the MCP Registry. GitHub's OIDC token proves the
  # io.github.MustacheCase namespace, so no login or secret is involved.
  mcp-registry:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish to the MCP Registry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSLo mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          jq --arg v "$TAG" '.version = $v | .packages[0].identifier = "docker.io/mustachecase/zanadir:" + $v' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
