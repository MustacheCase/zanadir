rules:
  - id: "grype-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    # A command or an image, not a name that contains it: syft's tests scan
    # the image anchore/test_images:grype-quality-dotnet, and grype-db only
    # builds the database.
    regex: "(?i)(?:^|[\\s/])grype(?:[\\s:@/]|$)"
    # The CLI exits 0 on findings unless asked to fail; anchore/scan-action
    # asks by default.
    exitsZeroUnless:
      runMatches: "--fail-on\\b|(?:^|\\s)-f[= ]+\\w|\\bGRYPE_FAIL_ON_SEVERITY=\\S"
      unknownWhen: "(?:^|\\s)(?:-c|--config)(?:[= ]|$)|\\bGRYPE_CONFIG="
      configFiles: [".grype.yaml", ".grype.yml", ".grype/config.yaml", ".grype/config.yml"]

  # What trivy checks depends on its sub-command and --scanners, so it is
  # matched on the command; parser/github.go turns trivy-action into one. These
  # sub-commands scan dependencies, unless the scanners leave vuln out or the
  # output is an SBOM, which trivy writes without scanning.
  - id: "trivy-rule"
    applyOn: ["Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\btrivy\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*(?:fs|filesystem|image|i|repo|repository|rootfs|vm|k8s|kubernetes|sbom)(?:\\s|$)"
    unless: "(?i)--(?:scanners|security-checks)[= ](?:secret|misconfig|config|license|rbac)(?:,(?:secret|misconfig|config|license|rbac))*(?:\\s|$)|\\s(?:--format|-f)[= ](?:cyclonedx|spdx|spdx-json)\\b"
    # trivy exits 0 on findings unless --exit-code, its env var or trivy.yaml
    # says otherwise. A flag outranks the file, so an explicit 0 is final.
    weakenedWhen:
      - runMatches: "--exit-code[= ]+0+\\b|\\bTRIVY_EXIT_CODE=0+\\b"
        verdict: "advisory"
    exitsZeroUnless:
      runMatches: "--exit-code[= ]+0*[1-9]|\\bTRIVY_EXIT_CODE=0*[1-9]"
      unknownWhen: "(?:^|\\s)(?:-c|--config)(?:[= ]|$)|\\bTRIVY_CONFIG="
      configFiles: ["trivy.yaml"]

  - id: "snyk-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bsnyk\\b|^snyksecurityscan$|^snyksecurity$"
    # The Bitbucket pipe and the Azure task each report without failing when
    # asked to.
    weakenedWhen:
      - input: "DONT_BREAK_BUILD"
        equals: "true"
        verdict: "advisory"
      - input: "failOnIssues"
        equals: "false"
        verdict: "advisory"

  - id: "anchore-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "(?i)anchore/scan-action|^anchore$"
    weakenedWhen:
      - input: "fail-build"
        equals: "false"
        verdict: "advisory"

  # Both bots declare themselves in a config file, which the dependency-bot
  # parser reports with the tool name as the whole package. Anchored because
  # "dependabot/fetch-metadata" is a real action for reading pull request
  # metadata, and repositories have whole workflows named dependabot-triage.
  - id: "dependabot-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "^dependabot$"

  - id: "renovate-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "^renovate$"

  - id: "govulncheck-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bgovulncheck\\b"

  # bundle-audit, bundler-audit, "bundle audit" and the rake task. Updating
  # the advisory database, or asking for the version, scans nothing.
  - id: "bundler-audit-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bbundler?[\\s:-]audit\\b"
    unless: "(?i)\\bbundler?[\\s:-]audit(?::|\\s+)(?:update|version|help)\\s*$"

  - id: "osv-scanner-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bosv-scanner\\b|google/osv-scanner-action"

  - id: "pip-audit-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bpip-audit\\b|pypa/gh-action-pip-audit"

  # "safety" is a common word, so only its check and scan sub-commands, or
  # pyupio's action and image. safety check fails on findings unless told to
  # --continue-on-error.
  - id: "safety-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?im)(?:^|[\\s/])safety\\s+(?:--?[\\w-]+(?:[= ]+[^\\s-]\\S*)?\\s+)*(?:check|scan)\\b|\\bpyupio/safety\\b"
    weakenedWhen:
      - runMatches: "--continue-on-error\\b"
        verdict: "advisory"

  - id: "cargo-audit-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bcargo\\s+audit\\b|\\b(rustsec|actions-rs)/audit-check\\b"

  # "retire" is an ordinary word, so only the program counts: a command that
  # starts with it, directly, by path or through npx and the like. It exits 13
  # on findings unless --exitwith says otherwise.
  - id: "retire-js-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?im)^(?:(?:npx|bunx|pnpx|pnpm\\s+dlx|yarn\\s+dlx|npm\\s+exec)(?:\\s+-\\S*)*\\s+)?(?:\\S*/)?retire(?:@\\S+)?(?:\\s|$)"
    weakenedWhen:
      - runMatches: "--exitwith[= ]+0+\\b"
        verdict: "advisory"

  # The audit subcommand, not the word: "audit" alone is in half the workflow
  # names on GitHub. A trailing "|| true", the usual way this one gets
  # defanged, is graded advisory for every tool.
  - id: "npm-audit-rule"
    applyOn: ["Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\b(npm|yarn|pnpm)\\s+audit\\b"
    # `npm audit signatures` verifies registry signatures and provenance;
    # it is a supply-chain check (npm-audit-signatures-rule), not SCA.
    unless: "(?i)\\b(?:npm|yarn|pnpm)\\s+audit\\s+signatures\\b"
    weakenedWhen:
      - runMatches: "(?i)--audit-level[= ]+none\\b"
        verdict: "advisory"

  # Composer's audit sub-command, options may come first; not a project's own
  # script that happens to be called audit (composer run-script audit).
  - id: "composer-audit-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bcomposer(?:\\.phar)?\\s+(?:-\\S+\\s+)*audit(?:\\s|$)"

  # GitHub Advanced Security for Azure DevOps.
  - id: "azure-dependency-scanning-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "(?i)^advancedsecurity-dependency-scanning$"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-dependency-scanning-template-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "(?i)^(?:jobs|security)/(?:dependency|container)-scanning(?:\\.latest|\\.v2)?\\.gitlab-ci\\.yml$|/components/(?:dependency|container)-scanning/"

  # OWASP Dependency-Check, from its CLI or its Jenkins plugin steps.
  - id: "dependency-check-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bdependency-check(?:\\.sh|\\.bat)?\\b|^dependencycheck(?:publisher)?$"

  # IBM's audit-ci, which fails when npm, yarn or pnpm audit reports above a
  # threshold. The program, optionally pinned, not its audit-ci.jsonc config.
  - id: "audit-ci-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\baudit-ci(?:@\\S*)?(?:\\s|$)"

  # Fails a pull request that adds a dependency with a known vulnerability.
  - id: "dependency-review-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "(?i)^actions/dependency-review-action$"
    weakenedWhen:
      - input: "warn-only"
        equals: "true"
        verdict: "advisory"

  # The advisories check of cargo deny; see cargo-deny-licenses-rule.
  - id: "cargo-deny-advisories-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bcargo[\\s-]deny\\b[^\\n]*\\bcheck\\b|embarkstudios/cargo-deny-action"
    unless: "(?i)\\bcheck\\s+(?:(?:licenses|bans|sources)\\s*)+$"

  # Elixir: mix_audit's deps.audit task or its standalone executable, and
  # Hex's hex.audit for retired packages, run alone or inside "mix do".
  - id: "mix-audit-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bmix\\b[^\\n]*\\b(?:deps|hex)\\.audit(?:[\\s,+]|$)|(?:^|[\\s/])mix_audit(?:\\s|$)"
