rules:
  - id: "grype-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bgrype\\b"

  - id: "trivy-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\btrivy\\b"
    weakenedWhen:
      - runMatches: "--exit-code[= ]+0\\b"
        verdict: "advisory"
      - input: "exit-code"
        equals: "0"
        verdict: "advisory"

  - id: "snyk-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bsnyk\\b"

  - id: "anchore-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "(?i)anchore/scan-action"
    weakenedWhen:
      - input: "fail-build"
        equals: "false"
        verdict: "advisory"

  # Both bots declare themselves in a config file, which the dependency-bot
  # parser reports with the tool name as the whole package. Anchored because
  # "dependabot/fetch-metadata" is a real action for reading pull request
  # metadata, and repositories have whole workflows named dependabot-triage.
  - id: "dependabot-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "^dependabot$"

  - id: "renovate-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "^renovate$"
