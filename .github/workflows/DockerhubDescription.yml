name: Docker Hub Description

# The overview shown on hub.docker.com/r/mustachecase/zanadir lives in
# docs/dockerhub.md, so it is reviewed like any other change and cannot drift.
on:
  push:
    branches: [main]
    paths:
      - docs/dockerhub.md
      - .github/workflows/DockerhubDescription.yml
  workflow_dispatch:

permissions: {}

jobs:
  description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: mustachecase/zanadir
          short-description: "Grades whether a repository's CI actually protects it: missing and weakened security controls"
          readme-filepath: docs/dockerhub.md
          enable-url-completion: true
