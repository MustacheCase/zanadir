rules:
  - id: "checkov-rule"
    name: "Checkov"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bcheckov\\b|bridgecrewio/checkov"
    weakenedWhen:
      - runMatches: "--soft-fail(?:\\s|$)"
        verdict: "advisory"
      - input: "soft_fail"
        equals: "true"
        verdict: "advisory"

  - id: "tfsec-rule"
    name: "tfsec"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\btfsec\\b"
    weakenedWhen:
      - runMatches: "--soft-fail(?:\\s|$)"
        verdict: "advisory"
      - input: "soft_fail"
        equals: "true"
        verdict: "advisory"

  - id: "terrascan-rule"
    name: "Terrascan"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bterrascan\\b"

  - id: "kics-rule"
    name: "KICS"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bkics\\b|checkmarx/kics"

  # Polaris audit reports findings but exits 0 unless an exit-code threshold
  # is explicitly enabled. Other Polaris commands do not scan IaC in CI.
  - id: "polaris-rule"
    name: "Polaris"
    applyOn: ["Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)(?:^|[\\s/])polaris(?::[\\w.-]+|@sha256:[0-9a-f]+)?\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*audit(?:\\s|$)"
    exitsZeroUnless:
      runMatches: "--set-exit-code-on-danger(?:=true)?(?:\\s|$)|--set-exit-code-below-score[= ]+(?:[1-9]|[1-9][0-9]|100)(?:\\s|$)"
      unknownWhen: "--set-exit-code-below-score[= ]+(?:\\$\\{|\\$\\(|\\$[A-Za-z_])|--set-exit-code-on-danger=\\$"

  - id: "kubescape-rule"
    name: "Kubescape"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bkubescape\\b"
    # kubescape fails only past a threshold. --fail-threshold (-t) gated in
    # old releases; current ones accept it and ignore it.
    exitsZeroUnless:
      runMatches: "--severity-threshold\\b|--compliance-threshold[= ]+(?:0*[1-9]|0*\\.\\d*[1-9])"
      unknownWhen: "--fail-threshold\\b|(?:^|\\s)-t[= ]+\\S"

  - id: "kube-linter-rule"
    name: "KubeLinter"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    # The lint command fails on findings in every output format, so no
    # exitsZeroUnless is needed.
    regex: "(?i)(?:^|[^\\w-])kube-linter(?::[\\w.-]+|@sha256:[0-9a-f]+)?\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*lint(?:\\s|$)|(?:^|[\\s/])stackrox/kube-linter-action(?:@|\\s|$)"

  # kube-score exits 1 on a critical finding by default, so it needs no
  # exitsZeroUnless. Only the score sub-command checks manifests; version,
  # help and completion check nothing.
  - id: "kube-score-rule"
    name: "kube-score"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bkube-score\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*score(?:\\s|$)"

  # kubeconform exits 1 when any resource is invalid or can't be validated,
  # and no flag turns that off, so it needs no weakenedWhen or
  # exitsZeroUnless. Match it only where it is the program being run (at the
  # start of a command or as a Helm plugin) or as the yannh/kubeconform image,
  # so release URLs, checksum greps and install scripts that name it don't.
  # `kubeconform -v` only prints the version.
  - id: "kubeconform-rule"
    name: "kubeconform"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?im)^(?:\\S*/)?(?:helm\\s+)?kubeconform(?:\\s|$)|\\byannh/kubeconform(?:[:@\\s]|$)"
    unless: "(?i)^\\S*kubeconform\\s+-v$"

  # kubeval (kubeconform's unmaintained predecessor) exits 1 when a file fails
  # validation and has no flag that turns that off. Its -v is
  # --kubernetes-version, so unlike kubeconform it needs no unless.
  - id: "kubeval-rule"
    name: "kubeval"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?im)^(?:\\S*/)?(?:helm\\s+)?kubeval(?:\\s|$)|\\bgarethr/kubeval(?:[:@\\s]|$)|\\binstrumenta/kubeval-action\\b"

  # Conftest fails on a policy violation by default, so it needs no
  # exitsZeroUnless. Only the test sub-command checks configuration: verify
  # runs the Rego unit tests, and pull, push, fmt and parse check nothing.
  - id: "conftest-rule"
    name: "Conftest"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bconftest\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*test(?:\\s|$)"

  # "snyk" alone is the SCA rule; only the iac sub-command scans infrastructure.
  - id: "snyk-iac-rule"
    name: "Snyk IaC"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bsnyk\\s+iac\\b"

  # Likewise trivy: config, or misconfig among the scanners of another
  # sub-command. See trivy-rule in sca.yaml.
  - id: "trivy-config-rule"
    name: "Trivy"
    applyOn: ["Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\btrivy\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*(?:config|conf)(?:\\s|$)|\\btrivy\\b[^\\n]*--(?:scanners|security-checks)[= ](?:[\\w-]+,)*(?:misconfig|config)\\b"
    # trivy exits 0 on findings unless --exit-code, its env var or trivy.yaml
    # says otherwise. A flag outranks the file, so an explicit 0 is final.
    weakenedWhen:
      - runMatches: "--exit-code[= ]+0+\\b|\\bTRIVY_EXIT_CODE=0+\\b"
        verdict: "advisory"
    exitsZeroUnless:
      runMatches: "--exit-code[= ]+0*[1-9]|\\bTRIVY_EXIT_CODE=0*[1-9]"
      unknownWhen: "(?:^|\\s)(?:-c|--config)(?:[= ]|$)|\\bTRIVY_CONFIG="
      configFiles: ["trivy.yaml"]

  - id: "cfn-nag-rule"
    name: "cfn-nag"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bcfn[-_]nag\\b"

  - id: "cfn-lint-rule"
    name: "cfn-lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bcfn-lint\\b"

  - id: "cfn-guard-rule"
    name: "CloudFormation Guard"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    # Only validate checks templates; test, rulegen and parse-tree work on the rules.
    regex: "(?i)(?:^|[\\s/;&|(])cfn-guard\\s+validate(?:\\s|$)"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-sast-iac-template-rule"
    name: "GitLab IaC Scanning"
    applyOn: ["Job.Package"]
    categories: ["IaC Security"]
    regex: "(?i)^(?:jobs|security)/sast-iac(?:\\.latest)?\\.gitlab-ci\\.yml$"
