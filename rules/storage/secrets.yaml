rules:
  - id: "gitleaks-rule"
    name: "Gitleaks"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Secrets Detection"]
    regex: "(?i)\\bgitleaks\\b"
    weakenedWhen:
      - runMatches: "--exit-code[= ]+0\\b"
        verdict: "advisory"

  # Installing ripsecrets' pre-commit hook does not run a secrets scan.
  - id: "ripsecrets-rule"
    name: "ripsecrets"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Secrets Detection"]
    regex: "(?i)(?:^|[\\s/])ripsecrets(?:[\\s:;|&@]|$)"
    unless: "(?i)^(?:\\S*/)?ripsecrets\\s+--install-pre-commit\\s*$"

  # Match the standalone CLI or a container/action path, not lookalikes such
  # as my-secretlint or secretlinter.
  - id: "secretlint-rule"
    name: "secretlint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Secrets Detection"]
    regex: "(?i)(?:^|[\\s/@])secretlint(?:[\\s/:;|&@]|$)"
    # Initialization creates config but does not scan any files.
    unless: "(?i)\\bsecretlint\\s+--init\\s*$"
    # Output files suppress secretlint's nonzero exit code on findings.
    weakenedWhen:
      - runMatches: "(?:^|\\s)--output(?:[=\\s]|$)"
        verdict: "advisory"

  - id: "trufflehog-rule"
    name: "TruffleHog"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Secrets Detection"]
    regex: "(?i)\\btrufflehog\\b"
    # The CLI fails only with --fail, which the action always passes.
    exitsZeroUnless:
      runMatches: "--fail(?:=true)?(?:\\s|$)"

  - id: "gitguardian-rule"
    name: "GitGuardian"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Secrets Detection"]
    regex: "(?i)\\b(?:ggshield|gitguardian)\\b"

  - id: "detect-secrets-rule"
    name: "detect-secrets"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Secrets Detection"]
    regex: "(?i)\\bdetect[-_]?secrets\\b"

  # Atlassian's own secret scanning pipe, atlassian/git-secrets-scan, and the
  # awslabs git-secrets tool it is named after.
  - id: "git-secrets-rule"
    name: "git-secrets"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Secrets Detection"]
    regex: "(?i)\\bgit[- ]secrets\\b"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-secret-detection-template-rule"
    name: "GitLab Secret Detection"
    applyOn: ["Job.Package"]
    categories: ["Secrets Detection"]
    regex: "(?i)^(?:jobs|security)/secret-detection(?:\\.latest)?\\.gitlab-ci\\.yml$|/components/secret-detection/"

  # trivy scans for secrets by default too, but in fs and repo only; counted
  # when asked for, like its other scanners. See trivy-rule in sca.yaml.
  - id: "trivy-secret-rule"
    name: "Trivy"
    applyOn: ["Job.Run"]
    categories: ["Secrets Detection"]
    regex: "(?i)\\btrivy\\b[^\\n]*--(?:scanners|security-checks)[= ](?:[\\w-]+,)*secret\\b"
    # trivy exits 0 on findings unless --exit-code, its env var or trivy.yaml
    # says otherwise. A flag outranks the file, so an explicit 0 is final.
    weakenedWhen:
      - runMatches: "--exit-code[= ]+0+\\b|\\bTRIVY_EXIT_CODE=0+\\b"
        verdict: "advisory"
    exitsZeroUnless:
      runMatches: "--exit-code[= ]+0*[1-9]|\\bTRIVY_EXIT_CODE=0*[1-9]"
      unknownWhen: "(?:^|\\s)(?:-c|--config)(?:[= ]|$)|\\bTRIVY_CONFIG="
      configFiles: ["trivy.yaml"]
