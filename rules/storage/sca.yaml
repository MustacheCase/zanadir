rules:
  - id: "grype-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bgrype\\b"

  - id: "trivy-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\btrivy\\b"

  - id: "snyk-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["SCA"]
    regex: "(?i)\\bsnyk\\b"

  - id: "anchore-rule"
    applyOn: ["Job.Package"]
    categories: ["SCA"]
    regex: "(?i)anchore/scan-action"