rules:
  - id: "eslint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\beslint\\b"

  - id: "pylint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bpylint\\b"

  - id: "golangci-lint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgolangci-lint\\b"

  - id: "rubocop-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\brubocop\\b"

  - id: "flake8-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bflake8\\b"

  - id: "oxsecurity-super-linter-rule"
    applyOn: [ "Artifact.Name", "Job.Package", "Job.Run" ]
    categories: [ "Linter" ]
    regex: "(?i)(super-linter/super-linter|oxsecurity/megalinter)"
