rules:
  - id: "eslint-rule"
    name: "ESLint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\beslint\\b"

  - id: "pylint-rule"
    name: "Pylint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bpylint\\b"

  - id: "ruff-rule"
    name: "Ruff"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bruff\\b"

  - id: "python-type-checker-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:mypy|pyright)\\b"

  - id: "golangci-lint-rule"
    name: "golangci-lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgolangci-lint\\b"

  # "revive" is also a plain word (revive-db.sh, revived), so it is matched as a
  # whole path segment. revive exits 0 on findings unless -set_exit_status is
  # given; a -config file can set error-code / warning-code instead.
  - id: "revive-rule"
    name: "revive"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    # Case-sensitive: Artifact.Name is the workflow name, and "Revive stale
    # issues" is not a Go linter. The revive CLI is always lower case.
    regex: "(?:^|[\\s/])revive(?:[\\s:@/]|$)"
    exitsZeroUnless:
      runMatches: "(?:^|\\s)--?set_exit_status\\b"
      unknownWhen: "(?:^|\\s)--?config(?:[= ]|$)"

  - id: "rubocop-rule"
    name: "RuboCop"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\brubocop\\b"

  - id: "flake8-rule"
    name: "Flake8"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bflake8\\b"

  - id: "oxsecurity-super-linter-rule"
    applyOn: [ "Artifact.Name", "Job.Package", "Job.Run" ]
    categories: [ "Linter" ]
    regex: "(?i)((?P<name>super-linter)/super-linter|oxsecurity/(?P<name>megalinter))"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-code-quality-template-rule"
    name: "GitLab Code Quality"
    applyOn: ["Job.Package"]
    categories: ["Linter"]
    regex: "(?i)^(?:jobs/)?code-quality\\.gitlab-ci\\.yml$"

  # Jenkins Warnings Next Generation, which publishes linter and static
  # analysis results.
  - id: "jenkins-record-issues-rule"
    name: "Warnings Next Generation"
    applyOn: ["Job.Package"]
    categories: ["Linter"]
    regex: "(?i)^recordissues$"

  # Static analysers for PHP.
  - id: "php-static-analysis-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:phpstan|psalm)\\b"

  - id: "clang-tidy-rule"
    name: "clang-tidy"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bclang-tidy\\b"

  - id: "shellcheck-rule"
    name: "ShellCheck"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bshellcheck\\b"

  - id: "yamllint-rule"
    name: "yamllint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\byamllint\\b"

  - id: "clippy-rule"
    name: "Clippy"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcargo\\s+clippy\\b|clippy-check"

  # Biome's binary is also a common word, so only its commands and action.
  - id: "biome-rule"
    name: "Biome"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bbiome\\s+(?:check|lint|ci)\\b|biomejs/setup-biome"

  - id: "oxlint-rule"
    name: "oxlint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\boxlint\\b"

  - id: "next-lint-rule"
    name: "next lint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bnext\\s+lint\\b"

  - id: "deno-lint-rule"
    name: "deno lint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bdeno\\s+lint\\b"

  - id: "stylelint-rule"
    name: "Stylelint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstylelint\\b"

  - id: "go-vet-rule"
    name: "go vet"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bgo\\s+vet\\b"

  - id: "staticcheck-rule"
    name: "Staticcheck"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstaticcheck\\b"

  - id: "kotlin-linter-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:ktlint(?:check)?|detekt)\\b"

  - id: "checkstyle-rule"
    name: "Checkstyle"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcheckstyle(?:main|test)?\\b"

  - id: "swiftlint-rule"
    name: "SwiftLint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bswiftlint\\b"
    # --fix only corrects, and --lenient turns every error into a warning.
    weakenedWhen:
      - runMatches: "(?:^|\\s)--(?:fix|autocorrect|lenient)(?:\\s|$)"
        verdict: "advisory"

  - id: "dart-analyze-rule"
    name: "dart analyze"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:dart|flutter)\\s+analyze\\b"
    # Errors still fail with these, but warnings or infos no longer do.
    weakenedWhen:
      - runMatches: "(?:^|\\s)--no-fatal-(?:warnings|infos)(?:\\s|$)"
        verdict: "partial"

  - id: "hadolint-rule"
    name: "Hadolint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bhadolint\\b"

  - id: "ansible-lint-rule"
    name: "ansible-lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bansible-lint\\b"   

  - id: "chart-testing-rule"
    name: "chart-testing"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bct\\s+lint(?:-and-install)?\\b"

  - id: "markdownlint-rule"
    name: "markdownlint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bmarkdownlint(?:-cli2?)?\\b"

  # `tflint --init` only installs plugins and `tflint -v` prints the version,
  # so neither lints anything.
  - id: "tflint-rule"
    name: "TFLint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\btflint\\b"
    unless: "(?i)^\\S*tflint\\s+(?:--init|-v)$"

  - id: "credo-rule"
    name: "Credo"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bmix\\s+credo\\b"

  - id: "standardrb-rule"
    name: "Standard Ruby"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bstandardrb\\b"

  - id: "haskell-lua-linter-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?:hlint|luacheck)\\b"

  - id: "vite-plus-lint-rule"
    name: "Vite+ lint"
    applyOn: ["Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bvp\\s+lint\\b"

  # Helm's lint subcommand validates charts; other helm subcommands do not.
  - id: "helm-lint-rule"
    name: "helm lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bhelm\\s+lint\\b"

  # buf is also used for generation and publishing; only lint and its CI actions count.
  - id: "buf-lint-rule"
    name: "buf lint"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:\\bbuf\\s+lint\\b|bufbuild/buf(?:-lint)?-action)"
    # buf-action can publish or check breaking changes without linting, or
    # only install buf.
    weakenedWhen:
      - input: "lint"
        equals: "false"
        verdict: "advisory"
      - input: "setup_only"
        equals: "true"
        verdict: "advisory"

  # codespell exits non-zero on a misspelling. CSpell (cspell) is a different tool,
  # and .codespellrc / codespell_lib are not runs of it.
  - id: "codespell-rule"
    name: "codespell"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\bcodespell\\b"
    # actions-codespell reports and always exits 0 when only_warn is set to any value.
    weakenedWhen:
      - input: "only_warn"
        equals: "1"
        verdict: "advisory"
      - input: "only_warn"
        equals: "true"
        verdict: "advisory"

  - id: "phpcs-rule"
    name: "PHP_CodeSniffer"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)(?:^|[\\s/])phpcs(?:[\\s:@/]|$)"

  # Formatters in check mode fail when a file is not formatted; without the
  # flag they rewrite files and pass. gofmt is left out: it exits 0 whatever
  # it finds, so it only gates inside a test -z wrapper.
  - id: "formatter-check-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?P<name>cargo\\s+fmt)\\b[^\\n]*\\s--check\\b|\\b(?P<name>rustfmt)\\b[^\\n]*\\s--check\\b|\\b(?P<name>prettier)(?:@\\S+)?\\s(?:[^\\n]*\\s)?(?:--check|-c|--list-different|-l)(?:\\s|$)|\\b(?P<name>black)\\s(?:[^\\n]*\\s)?--check(?:\\s|$)|\\b(?P<name>isort)\\s(?:[^\\n]*\\s)?(?:--check-only|--check|-c)(?:\\s|$)|\\b(?P<name>dotnet\\s+format)\\b[^\\n]*\\s--verify-no-changes\\b|\\b(?P<name>dart\\s+format)\\b[^\\n]*\\s--set-exit-if-changed\\b|\\b(?P<name>(?:terraform|tofu)\\s+fmt)\\b[^\\n]*\\s-check\\b|\\b(?P<name>shfmt)\\s(?:[^\\n]*\\s)?(?:-d|--diff)(?:\\s|$)|\\b(?P<name>clang-format)(?:-\\d+)?\\s[^\\n]*(?:--dry-run|-n)\\s[^\\n]*--Werror\\b|\\b(?P<name>clang-format)(?:-\\d+)?\\s[^\\n]*--Werror\\s[^\\n]*(?:--dry-run|-n)(?:\\s|$)|\\b(?P<name>spotless)(?::check|Check)\\b|\\b(?P<name>dprint)\\s+check\\b|\\b(?P<name>oxfmt)\\b[^\\n]*\\s--check\\b|\\b(?P<name>mix\\s+format)\\b[^\\n]*\\s--check-formatted\\b|\\b(?P<name>deno\\s+fmt)\\b[^\\n]*\\s--check\\b|^(?P<name>dprint)/check$|^DoozyX/(?P<name>clang-format)-lint-action$"

  # pre-commit and prek run whatever hooks the config lists, counted as linting
  # without reading the config. prek runs the hooks when given no subcommand.
  - id: "pre-commit-rule"
    applyOn: ["Job.Package", "Job.Run"]
    categories: ["Linter"]
    regex: "(?i)\\b(?P<name>pre-commit)\\s+run\\b|(?:^|\\n)(?:\\S*/)?(?P<name>prek)(?:\\s+(?:run\\b|-|[\\\"'$])|[ \\t]*(?:\\n|$))|^(?P<name>pre-commit)/action$|^j178/(?P<name>prek)-action$"
    # Without a file selection only staged files are checked, and a CI
    # checkout has none, so every hook is skipped.
    exitsZeroUnless:
      runMatches: "(?:^|\\s)(?:--all-files|-a|--files|--glob|--directory|-d|--from-ref|--source|-s|--to-ref|--origin|-o|--last-commit)(?:[=\\s]|$)"
      unknownWhen: "\\$"
