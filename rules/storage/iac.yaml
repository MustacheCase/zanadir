rules:
  - id: "checkov-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bcheckov\\b|bridgecrewio/checkov"
    weakenedWhen:
      - runMatches: "--soft-fail(?:\\s|$)"
        verdict: "advisory"
      - input: "soft_fail"
        equals: "true"
        verdict: "advisory"

  - id: "tfsec-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\btfsec\\b"
    weakenedWhen:
      - runMatches: "--soft-fail(?:\\s|$)"
        verdict: "advisory"
      - input: "soft_fail"
        equals: "true"
        verdict: "advisory"

  - id: "terrascan-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bterrascan\\b"

  - id: "kics-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bkics\\b|checkmarx/kics"

  - id: "kubescape-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bkubescape\\b"
    # kubescape fails only past a threshold. --fail-threshold (-t) gated in
    # old releases; current ones accept it and ignore it.
    exitsZeroUnless:
      runMatches: "--severity-threshold\\b|--compliance-threshold[= ]+(?:0*[1-9]|0*\\.\\d*[1-9])"
      unknownWhen: "--fail-threshold\\b|(?:^|\\s)-t[= ]+\\S"

  # kube-score exits 1 on a critical finding by default, so it needs no
  # exitsZeroUnless. Only the score sub-command checks manifests; version,
  # help and completion check nothing.
  - id: "kube-score-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bkube-score\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*score(?:\\s|$)"

  # Conftest fails on a policy violation by default, so it needs no
  # exitsZeroUnless. Only the test sub-command checks configuration: verify
  # runs the Rego unit tests, and pull, push, fmt and parse check nothing.
  - id: "conftest-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bconftest\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*test(?:\\s|$)"

  # "snyk" alone is the SCA rule; only the iac sub-command scans infrastructure.
  - id: "snyk-iac-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bsnyk\\s+iac\\b"

  # Likewise trivy: config, or misconfig among the scanners of another
  # sub-command. See trivy-rule in sca.yaml.
  - id: "trivy-config-rule"
    applyOn: ["Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\btrivy\\s+(?:-[\\w-]+(?:[= ]\\S+)?\\s+)*(?:config|conf)(?:\\s|$)|\\btrivy\\b[^\\n]*--(?:scanners|security-checks)[= ](?:[\\w-]+,)*(?:misconfig|config)\\b"
    # trivy exits 0 on findings unless --exit-code, its env var or trivy.yaml
    # says otherwise. A flag outranks the file, so an explicit 0 is final.
    weakenedWhen:
      - runMatches: "--exit-code[= ]+0+\\b|\\bTRIVY_EXIT_CODE=0+\\b"
        verdict: "advisory"
    exitsZeroUnless:
      runMatches: "--exit-code[= ]+0*[1-9]|\\bTRIVY_EXIT_CODE=0*[1-9]"
      unknownWhen: "(?:^|\\s)(?:-c|--config)(?:[= ]|$)|\\bTRIVY_CONFIG="
      configFiles: ["trivy.yaml"]

  - id: "cfn-nag-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bcfn[-_]nag\\b"

  - id: "cfn-lint-rule"
    applyOn: ["Artifact.Name", "Job.Package", "Job.Run"]
    categories: ["IaC Security"]
    regex: "(?i)\\bcfn-lint\\b"

  # GitLab's own templates and CI/CD components, recorded by name from include:.
  - id: "gitlab-sast-iac-template-rule"
    applyOn: ["Job.Package"]
    categories: ["IaC Security"]
    regex: "(?i)^(?:jobs|security)/sast-iac(?:\\.latest)?\\.gitlab-ci\\.yml$"
