# Ready-to-use CI configuration for suggested tools, keyed by tool name and
# platform. Tool names must match suggestions.yaml exactly; NewFixService
# rejects any that do not.
#
# Actions are pinned to a major tag where the action publishes one, and to a
# release where it does not; never to a branch. A downloaded binary is pinned
# to a release and checked against its published sha256, never piped to sh. Revisit them when a tool cuts
# a new major, or archives the action.
templates:
  - tool: "Gitleaks"
    platform: "github"
    step: |
      # The CLI rather than gitleaks-action, which needs a licence key on
      # organisation accounts.
      - name: Detect secrets
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose

  - tool: "Gitleaks"
    platform: "gitlab"
    step: |
      secret_detection:
        image:
          name: zricethezav/gitleaks
          entrypoint: [""]
        script:
          - gitleaks detect --source . --verbose

  - tool: "Gitleaks"
    platform: "bitbucket"
    step: |
      - step:
          name: Secret detection
          image: zricethezav/gitleaks
          script:
            - gitleaks detect --source . --verbose

  - tool: "Gitleaks"
    platform: "azure"
    step: |
      - script: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose
        displayName: Secret detection

  - tool: "Gitleaks"
    platform: "jenkins"
    step: |
      stage('Secret detection') {
          steps {
              sh '''
                  curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                  echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
                  tar -xzf gitleaks.tar.gz gitleaks
                  ./gitleaks detect --source . --verbose
              '''
          }
      }

  - tool: "TruffleHog"
    platform: "github"
    step: |
      - name: Detect secrets
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --results=verified,unknown

  - tool: "Trivy"
    platform: "github"
    step: |
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          exit-code: "1"

  - tool: "Trivy"
    platform: "gitlab"
    step: |
      dependency_scanning:
        image:
          name: aquasec/trivy
          entrypoint: [""]
        script:
          - trivy fs --exit-code 1 .

  - tool: "Trivy"
    platform: "bitbucket"
    step: |
      - step:
          name: Dependency scanning
          image: aquasec/trivy
          script:
            - trivy fs --exit-code 1 .

  - tool: "Trivy"
    platform: "azure"
    step: |
      - script: docker run --rm -v "$(Build.SourcesDirectory):/src" aquasec/trivy fs --exit-code 1 /src
        displayName: Dependency scanning

  - tool: "Trivy"
    platform: "jenkins"
    step: |
      stage('Dependency scanning') {
          steps {
              sh 'docker run --rm -v "$WORKSPACE:/src" aquasec/trivy fs --exit-code 1 /src'
          }
      }

  - tool: "Grype"
    platform: "github"
    step: |
      - name: Scan dependencies
        uses: anchore/scan-action@v7
        with:
          path: .
          fail-build: true

  - tool: "Semgrep"
    platform: "github"
    step: |
      # semgrep-action is archived; the CLI is what Semgrep documents now.
      - name: Static analysis
        run: pipx run semgrep scan --config auto --error

  - tool: "CodeQL"
    platform: "github"
    step: |
      # CodeQL needs its own job; see
      # https://github.com/github/codeql-action for the full workflow.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  - tool: "gosec"
    platform: "github"
    step: |
      - name: Static analysis
        uses: securego/gosec@v2.29.0
        with:
          args: ./...

  - tool: "Bandit"
    platform: "github"
    step: |
      - name: Static analysis
        run: |
          pip install bandit
          bandit -r .

  - tool: "Checkov"
    platform: "github"
    step: |
      - name: Scan infrastructure as code
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .

  # trivy config exits 0 on findings unless told otherwise.
  - tool: "Trivy"
    platform: "github"
    category: "IaC Security"
    step: |
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
      - name: Scan infrastructure as code
        run: trivy config --exit-code 1 .

  # End-of-life detection is OS-level, so it needs an image, not the repo.
  - tool: "Trivy"
    platform: "github"
    category: "End Of Life"
    step: |
      - name: Build the image to check
        run: docker build -t local/eol-scan .
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
      - name: Check for end-of-life components
        run: trivy image --exit-on-eol 1 local/eol-scan

  - tool: "Grant"
    platform: "github"
    step: |
      # Grant has no action of its own.
      - name: Check licences
        run: |
          curl -sSfLo grant.tar.gz https://github.com/anchore/grant/releases/download/v0.6.8/grant_0.6.8_linux_amd64.tar.gz
          echo "6500f8bbf0f20fb993de8084686e199f0ba1eb494769ff75454286d5ef63f919  grant.tar.gz" | sha256sum -c -
          tar -xzf grant.tar.gz grant
          ./grant check dir:.

  - tool: "Codecov"
    platform: "github"
    step: |
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  - tool: "GolangCI-Lint"
    platform: "github"
    step: |
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

  - tool: "ESLint"
    platform: "github"
    step: |
      - name: Lint
        run: |
          npm ci
          npx eslint .

  - tool: "k6"
    platform: "github"
    step: |
      - name: Set up k6
        uses: grafana/setup-k6-action@v1
      - name: Load test
        uses: grafana/run-k6-action@v1
        with:
          path: load-test.js

  # Cosign and the attestation actions need id-token and attestations
  # permissions, which the generated standalone workflow does not grant, so
  # only SBOM generation is templated for this category.
  - tool: "Syft"
    platform: "github"
    step: |
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: sbom.spdx.json

  - tool: "zizmor"
    platform: "github"
    step: |
      # advanced-security: false fails the job on findings instead of
      # uploading them, which would need security-events: write.
      - name: Check workflows for security problems
        uses: zizmorcore/zizmor-action@v0.7.1
        with:
          advanced-security: false

  - tool: "glsec"
    platform: "gitlab"
    step: |
      # Fails the pipeline on error findings. The entrypoint override lets
      # the runner's shell start; the image's own entrypoint is glsec.
      glsec:
        image:
          name: ghcr.io/glsec/glsec:1.23.0
          entrypoint: [""]
        script:
          - glsec .gitlab-ci.yml
